async function chiudiAccount(b){
  const conferma = ($('#chiudiConf').value || '').trim().toUpperCase();
  if (conferma !== 'ELIMINA') return toast('Scrivi ELIMINA per confermare');
  b.disabled = true; b.textContent = 'Chiudo…';
  const { data, error } = await sb.functions.invoke('account', { body:{ azione:'chiudi', conferma } });
  if (error || data?.error) { b.disabled = false; b.textContent = 'Chiudi l\'account'; return fail(data?.error || error); }
  try { Object.keys(localStorage).filter(k => k.startsWith('uliveto:')).forEach(k => localStorage.removeItem(k)); } catch(e){}
  closeSheet(); toast('Account chiuso. Grazie per aver usato Il mio Uliveto.');
  setTimeout(() => logout(), 1200);
}

/* ===== Vetrina: colori, livelli dei punti oliva, disegno ===== */
const COLORI_VETRINA = { oliva:['#4d5a2c','#e8ecd6','Oliva'], oro:['#8a6a0c','#f6eccb','Oro'], terra:['#8a4b2a','#f4e1d6','Terra'],
  mare:['#2f6176','#dcebf0','Mare'], lavanda:['#5e4a7a','#ebe4f3','Lavanda'], notte:['#2b2e22','#e3e0d2','Notte'] };
const LIVELLI = [ { k:'germoglio', ic:'🌱', nome:'Germoglio', da:0 }, { k:'ramoscello', ic:'🌿', nome:'Ramoscello', da:100 },
  { k:'oliva', ic:'🫒', nome:'Oliva', da:250 }, { k:'ulivo', ic:'🌳', nome:'Ulivo', da:500 }, { k:'secolare', ic:'🏛️', nome:'Ulivo secolare', da:1000 } ];
// Punti oliva: 50 di benvenuto + per ogni ordine consegnato 20 punti e 10 per litro (calcolati dagli ordini, non modificabili dal cliente)
const puntiOrdine = o => 20 + Math.round(litriOrdine(o) * 10);
function puntiDa(cliente, ordini){
  if (!cliente || !['approvato','bloccato'].includes(cliente.stato)) return null;
  const cons = (ordini || []).filter(o => o.cliente_id === cliente.id && o.stato === 'consegnato');
  const punti = 50 + sum(cons, puntiOrdine);
  let i = LIVELLI.length - 1; while (i > 0 && punti < LIVELLI[i].da) i--;
  const liv = LIVELLI[i], pros = LIVELLI[i + 1];
  return { punti, ordini:cons.length, litri:sum(cons, litriOrdine), liv, pros, perc: pros ? (punti - liv.da) / (pros.da - liv.da) : 1, mancano: pros ? pros.da - punti : 0 };
}
const accento = v => { const c = COLORI_VETRINA[v?.colore] || COLORI_VETRINA.oliva; return `--acc:${c[0]};--acc-soft:${c[1]}`; };

async function avviaCliente(){
  const slug = slugCliente();
  try { if (slug) localStorage.setItem('uliveto:negozio', slug); } catch(e){}
  C.negozio = null; C.pub = null;
  if (slug) {
    const { data, error } = await sb.rpc('vetrina_pubblica', { p_slug: slug });
    if (error) throw error;
    C.pub = data || null;
    C.negozio = data ? { id:data.id, nome:data.nome, descrizione:data.descrizione, attivo:data.attivo } : null;
  }
  if (C.negozio) await caricaCliente();
  const h = { '#ordini':'punti', '#prenota':'ordina', '#bacheca':'bacheca' }[location.hash];
  if (h) { C.vista = h; history.replaceState(null, '', location.pathname + location.search); }
  renderCliente();
  if (C.negozio && C.cliente) liveCliente();
}
async function caricaCliente(){
  const n = C.negozio.id, uid = S.user.id;
  const [cl, fo, or, ne, ge, an] = await Promise.all([
    sb.from('clienti').select('*').eq('negozio_id', n).eq('user_id', uid).maybeSingle(),
    sb.from('formati').select('*').eq('negozio_id', n).eq('attivo', true).order('ordine').order('litri'),
    sb.from('ordini').select('*, ordine_righe(*)').eq('negozio_id', n).eq('user_id', uid).order('created_at', { ascending:false }),
    sb.from('negozi').select('owner_id, note_consegna, attivo').eq('id', n).maybeSingle(),
    sb.rpc('e_gestore', { p_negozio: n }),
    sb.from('annunci').select('*').eq('negozio_id', n).order('created_at', { ascending:false }).limit(30)
  ]);
  for (const r of [cl, fo, or, ne]) if (r.error) throw r.error;
  C.cliente = cl.data; C.formati = fo.data || []; C.ordini = or.data || []; C.annunci = an.data || [];
  C.invitoDati = null;
  if (!C.cliente) { const iv = await sb.rpc('invito_cliente', { p_negozio:n, p_invito:invitoSalvato() }); if (!iv.error && iv.data) C.invitoDati = iv.data; }
  C.owner = ne.data?.owner_id === uid || ge.data === true; C.titolare = ne.data?.owner_id === uid; C.noteConsegna = ne.data?.note_consegna || C.pub?.note_consegna || '';
  if (ne.data) C.negozio.attivo = ne.data.attivo;
  C.disp = null;
  if (C.cliente?.stato === 'approvato' || C.owner) { const d = await sb.rpc('disponibilita', { p_negozio: n }); if (!d.error) C.disp = d.data; }
}

function quandoFa(ts){
  const s = (Date.now() - new Date(ts)) / 1000;
  return s < 90 ? 'adesso' : s < 3600 ? Math.round(s / 60) + ' min fa' : s < 86400 ? Math.round(s / 3600) + ' ore fa' : fdate(ts.slice(0, 10));
}

async function impostaAnnunci(v, el){
  const { error } = await sb.rpc('imposta_annunci', { p_negozio:C.negozio.id, p_valore:v, p_versione:LEGALE.versione });
  if (error) { if (el) el.checked = !v; return fail(error); }
  C.cliente.annunci_ok = v;
  toast(v ? 'Ti avviseremo dei nuovi annunci 📣' : 'Niente più notifiche per gli annunci');
  if (v && pushSupportate() && !(await iscrizioneCorrente().catch(() => null))) attivaNotifiche().then(statoNotificheCliente);
  if (C.vista === 'bacheca') renderCliente();
}
async function statoNotificheCliente(){
  const box = $('#notiCli'); if (!box) return;
  if (!pushSupportate()) { box.querySelector('.btn')?.remove(); box.querySelector('.muted').innerHTML = iOS() && !standalone()
      ? 'Su iPhone aggiungi prima questa pagina alla schermata Home (Condividi → Aggiungi alla schermata Home) e aprila da lì.' : 'Questo browser non supporta le notifiche.'; return; }
  const sub = await iscrizioneCorrente().catch(() => null);
  if (sub && $('#notiCli')) $('#notiCli').innerHTML = '<h2>🔔 Notifiche attive</h2><div class="muted">Riceverai qui conferme e consegne dei tuoi ordini' + (C.cliente?.annunci_ok ? ' e gli annunci del produttore.' : '. Per gli annunci attiva anche l\'interruttore qui sotto.') + '</div>';
}

    await caricaCliente().catch(() => {});

    if (prima && dopo && dopo.liv.k !== prima) setTimeout(() => toast(`🎉 Nuovo livello: ${dopo.liv.ic} ${dopo.liv.nome}!`), 1800);
    // mentre si compila la prenotazione non si ridisegna il modulo: si aggiornano solo le schede
    if (ridisegna && !(C.vista === 'ordina' && document.activeElement?.closest('#frmOrd'))) { const y = scrollY; renderCliente(); scrollTo(0, y); }
  };
  C._live = sb.channel('cliente-' + S.user.id)
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'ordini', filter:`user_id=eq.${S.user.id}` }, p => {

    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'clienti', filter:`user_id=eq.${S.user.id}` }, p => aggiorna(p.new.stato === 'approvato' ? '🎉 Sei stato autorizzato: ora puoi prenotare!' : null))
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'annunci', filter:`negozio_id=eq.${C.negozio.id}` }, p => aggiorna('📣 ' + p.new.titolo))
    .subscribe();
}

async function caricaFoto(file){
  if (!file) return null;
  if (!/^image\//.test(file.type)) throw new Error('Scegli un\'immagine (JPG o PNG)');
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
  const path = `${negozio().id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const { error } = await sb.storage.from('vetrine').upload(path, blob, { contentType:'image/jpeg', cacheControl:'31536000', upsert:false });
  if (error) throw error;
  return sb.storage.from('vetrine').getPublicUrl(path).data.publicUrl;
}
function scegliFoto(cb, multipla){
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; if (multipla) i.multiple = true;
  i.onchange = async () => {
    const files = [...i.files]; if (!files.length) return;
    toast(files.length > 1 ? `Carico ${files.length} foto…` : 'Carico la foto…');
    try { for (const f of files) cb(await caricaFoto(f)); toast('Foto caricata ✓'); } catch(e){ fail(e); }
  };
  i.click();
}

function magazzinoAnnate(){
  const per = {};

  (S.moliture || []).forEach(m => { if (m.data) a(+m.data.slice(0,4)).prodotto += litri(m) || 0; });

  return Object.values(per).map(x => ({ ...x, totale: x.prodotto + x.aggiunto - x.usato })).sort((x, y) => y.annata - x.annata);
}

function testoInvito(c){
  const n = negozio(), link = shopUrl(n.slug) + '&invito=' + encodeURIComponent(c.invito || '');
  return `Ciao ${(c.nome || '').split(' ')[0]}! Da quest'anno puoi prenotare l'olio di ${n.nome} dal telefono. Ho già inserito i tuoi dati: apri il link, crea l'account e controlla l'indirizzo. Avrai subito 50 punti oliva di benvenuto 🫒\n${link}\n\nSe non vuoi ricevere altri messaggi, rispondimi NO.`;
}
async function invitaCliente(id, via){
  const c = clienteDi(id); if (!c?.invito) return toast('Questo cliente ha già accettato l\'invito');
  via ||= c.telefono ? 'wa' : c.email ? 'mail' : 'copia';
  const t = testoInvito(c);
  if (via === 'wa') window.open('https://wa.me/' + numeroWa(c.telefono) + '?text=' + encodeURIComponent(t), '_blank', 'noopener');
  else if (via === 'mail') location.href = 'mailto:' + encodeURIComponent(c.email) + '?subject=' + encodeURIComponent('Prenota l\'olio di ' + negozio().nome) + '&body=' + encodeURIComponent(t);
  else { try { await navigator.clipboard.writeText(t); toast('Invito copiato: incollalo dove vuoi'); } catch(e) { prompt('Copia l\'invito:', t); } }
  const { error } = await sb.from('clienti').update({ invitato_at:new Date().toISOString() }).eq('id', id);
  if (!error) { c.invitato_at = new Date().toISOString(); if (S.tab === 'vendite' && !$('#sheet').classList.contains('open')) viewVendite(); }
}
async function eliminaCliente(id){
  if (!confirm('Eliminare questo cliente? Il suo invito smetterà di funzionare.')) return;
  const { error } = await sb.from('clienti').delete().eq('id', id); if (error) return fail(error);
  closeSheet(); await refresh(); toast('Eliminato');
}

const SINONIMI_IMPORT = [['cognome',/^(cognome|surname|last ?name)$/],['nome',/^(nome|nominativo|cliente|nome e cognome|nome cognome|ragione sociale|name|full ?name|first ?name|contatto)$/],

const normCol = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[_]+/g, ' ').trim();
const indovinaCampo = t => (SINONIMI_IMPORT.find(([, re]) => re.test(normCol(t))) || [''])[0];
function caricaSheetJS(){
  if (window.XLSX) return Promise.resolve();
  return caricaSheetJS._p ||= new Promise((ok, ko) => { const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = ok; sc.onerror = () => { caricaSheetJS._p = null; ko(new Error('Non riesco a caricare il lettore di Excel: controlla la connessione')); };
    document.head.appendChild(sc); });
}

async function leggiFileImport(file){
  if (!file) return; const box = $('#impAnteprima'); box.innerHTML = '<div class="card"><div class="empty">Leggo il file…</div></div>';
  try {
    await caricaSheetJS();
    let wb; const buf = await file.arrayBuffer();
    if (/\.(csv|txt)$/i.test(file.name)) {
      let txt; try { txt = new TextDecoder('utf-8', { fatal:true }).decode(buf); } catch(e) { txt = new TextDecoder('windows-1252').decode(buf); }
      txt = txt.replace(/^\ufeff/, ''); const riga = txt.split(/\r?\n/)[0] || '';
      const sep = [';', ',', '\t'].sort((a, b) => riga.split(b).length - riga.split(a).length)[0];
      wb = XLSX.read(txt, { type:'string', FS:sep, raw:true });
    } else wb = XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const righe = XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' }).filter(r => r.some(x => String(x).trim()));
    if (!righe.length) throw new Error('Il file è vuoto');
    // la riga d'intestazione è la prima (tra le prime 5) con almeno due colonne riconosciute
    let h = righe.slice(0, 5).findIndex(r => r.filter(x => indovinaCampo(x)).length >= 2);
    const intest = h >= 0 ? righe[h] : righe[0].map((_, i) => 'Colonna ' + (i + 1));
    IMP = { righe: righe.slice(h >= 0 ? h + 1 : 0), intest, mappa: intest.map(x => h >= 0 ? indovinaCampo(x) : ''), file:file.name };
    disegnaImport();
  } catch(e) { box.innerHTML = ''; fail(e); }
}
let IMP = null;
function righeImport(){
  return IMP.righe.map(r => { const o = {}; IMP.mappa.forEach((k, i) => { const v = String(r[i] ?? '').trim(); if (k && v) o[k] = o[k] ? o[k] + ' ' + v : v; });
    if (o.cognome) { o.nome = [o.nome, o.cognome].filter(Boolean).join(' '); delete o.cognome; }
    if (o.civico) { o.indirizzo = [o.indirizzo, o.civico].filter(Boolean).join(' '); delete o.civico; }
    if (o.cap && /^\d{1,4}$/.test(o.cap)) o.cap = o.cap.padStart(5, '0');
    if (o.telefono) o.telefono = o.telefono.replace(/\.0+$/, '');
    return o; });
}

        ${senzaInd ? `<li class="att">${senzaInd} senza indirizzo completo: lo inseriranno loro accettando l'invito</li>` : ''}</ul>
      <label class="chk"><input type="checkbox" id="impDich"> Confermo che queste persone hanno già acquistato da me e che posso contattarle per proporre la prenotazione.</label>
      <button class="btn block" ${valide.length ? '' : 'disabled'} onclick="confermaImport(this)">📥 Importa ${valide.length} ${valide.length === 1 ? 'cliente' : 'clienti'}</button></div>`;

function totOrdine(){
  let t = 0, completo = true;
  document.querySelectorAll('[data-riga]').forEach(i => { if (i.value === '') completo = false; t += Number(i.value || 0) * Number(i.dataset.q); });
  t += Number($('#speseC')?.value || 0);
  $('#totOrd').textContent = completo ? eur(t) : 'manca qualche prezzo';
  return completo ? Math.round(t * 100) / 100 : null;
}
async function aggiornaOrdine(id, stato){
  const o = S.ordini.find(x => x.id === id), c = clienteDi(o.cliente_id);
  const mod = ['richiesta','confermato'].includes(o.stato);
  const up = { stato, aggiornato_at: new Date().toISOString(), nota_gestore: $('#notaG')?.value || null };
  try {
    if (mod && stato !== 'annullato') {
      const tot = totOrdine();
      if (tot == null) return toast('Inserisci il prezzo di ogni formato prima di confermare');
      for (const i of document.querySelectorAll('[data-riga]')) {
        const { error } = await sb.from('ordine_righe').update({ prezzo_unitario: Number(i.value) }).eq('id', i.dataset.riga); if (error) throw error;
      }
      up.spese_consegna = $('#speseC').value === '' ? null : Number($('#speseC').value);
      up.totale = tot;
    }
    if (stato === 'annullato' && !confirm(o.stato === 'richiesta' ? 'Rifiutare questo ordine?' : 'Annullare questo ordine?')) return;
    if (stato === 'consegnato') {
      if (!confirm(`Confermi la consegna e il pagamento di ${eur(o.totale)}? L'incasso verrà aggiunto ai Conti.`)) return;
      const mv = await save('movimenti', { data: today(), tipo:'entrata', categoria:'vendita olio', importo: o.totale || 0,
        descrizione: `Ordine ${c.nome || ''} · ${num(litriOrdine(o), 2)} L` });
      up.movimento_id = mv.id;
    }
    const { error } = await sb.from('ordini').update(up).eq('id', id); if (error) throw error;
    closeSheet(); await refresh();
    toast({ confermato: o.stato === 'confermato' ? 'Ordine salvato ✓' : 'Ordine confermato ✓', in_consegna:'Ordine in consegna 🚚', consegnato:'Consegnato · incasso registrato ✓', annullato:'Ordine annullato' }[stato]);
  } catch(e) { fail(e); }
}

async function aggiornaAccessi(){
  try { await sb.rpc('accetta_inviti'); } catch(e){}
  const { data, error } = await sb.from('collaboratori').select('owner_id, ruolo, azienda, stato').eq('user_id', S.user.id).eq('stato', 'attivo');
  if (error) return;
  S.accessi = data || [];
  const pref = leggiPref();
  if (S.owner !== S.user.id) {
    const a = accessoAttivo();
    if (a) S.ruolo = a.ruolo; else { S.owner = S.user.id; S.ruolo = 'owner'; }
  } else if (!pref && S.accessi.length) {
    // primo accesso di un collaboratore: apre direttamente l'uliveto a cui è stato invitato

}

/* ===== Promemoria: lavori da fare ===== */
function giorniDa(d){ return Math.round((new Date(d + 'T00:00') - new Date(today() + 'T00:00')) / 864e5); }
function etichettaData(d){
  const g = giorniDa(d), dt = new Date(d + 'T00:00');
  if (g < 0) return { cl:'ritardo', top: g === -1 ? 'ieri' : `${-g} gg fa`, n: dt.getDate() };
  if (g === 0) return { cl:'oggi', top:'oggi', n: dt.getDate() };
  if (g === 1) return { cl:'', top:'domani', n: dt.getDate() };
  return { cl:'', top: MESI[dt.getMonth()], n: dt.getDate() };
}
function rowPromemoria(p){
  const e = etichettaData(p.data), dove = appName(p.appezzamento_id);
  return `<div class="row tap" onclick="schedaPromemoria('${p.id}')"><div class="prom-data ${e.cl}">${e.top}<b>${e.n}</b></div>
    <div class="main"><div class="t">${TIPO_IC[p.tipo] || '📌'} ${esc(p.titolo)}</div><div class="s">${[dove, p.prodotto].filter(Boolean).map(esc).join(' · ') || esc(p.tipo)}</div></div><div class="muted">›</div></div>`;
}
function cardDaFare(entroGiorni, max){
  const tutti = (S.promemoria || []).filter(p => !p.fatto);
  const lista = entroGiorni ? tutti.filter(p => giorniDa(p.data) <= entroGiorni).slice(0, max || 99) : tutti;
  if (entroGiorni && !lista.length) return '';
  const ritardo = tutti.filter(p => giorniDa(p.data) < 0).length;
  return `<div class="card"><h2>📌 ${entroGiorni ? 'Prossimi lavori' : 'Da fare'}<span class="sp"></span>${ritardo ? `<span class="badge red">${ritardo} in ritardo</span>` : ''}
      ${entroGiorni ? `<button class="btn sm sec" onclick="S.tab='lavori';render()">Tutti</button>` : `<button class="btn sm sec" onclick="formPromemoria()">+ Promemoria</button>`}</h2>
    ${lista.map(rowPromemoria).join('') || '<div class="muted">Nessun lavoro in programma. Aggiungi un promemoria e ti avviseremo il giorno stesso.</div>'}</div>`;
}
function formPromemoria(id){
  const p = (S.promemoria || []).find(x => x.id === id) || {};
  openForm({ title: id ? 'Modifica promemoria' : 'Nuovo promemoria', fields:[
    {name:'titolo',label:'Cosa fare',required:true,value:p.titolo,ph:'es. Secondo trattamento rameico'},
    {name:'data',label:'Quando',type:'date',required:true,value:p.data || addDays(today(), 7),half:true},
    {name:'tipo',label:'Tipo',type:'select',options:TIPI,value:p.tipo || 'trattamento',empty:false,half:true},
    {name:'prodotto',label:'Prodotto',value:p.prodotto,ph:'facoltativo'},
    {name:'appezzamento_id',label:'Appezzamento',type:'select',options:appOpts(),value:p.appezzamento_id,empty:'Intero uliveto'},
    {name:'note',label:'Note',type:'textarea',value:p.note}],
    extra:'<div class="hint" style="margin-top:-2px">Il giorno indicato, alle 7 del mattino, arriva una notifica a te e alla tua squadra.</div>',
    onSubmit: v => save('promemoria', id ? { ...v, notificato_at: v.data !== p.data ? null : p.notificato_at } : v, id),
    onDelete: id && (() => remove('promemoria', id)) });
}
function schedaPromemoria(id){
  const p = (S.promemoria || []).find(x => x.id === id); if (!p) return;
  const e = etichettaData(p.data);
  openSheet(`<h3>${TIPO_IC[p.tipo] || '📌'} ${esc(p.titolo)}</h3>
    <div class="card">
      <div class="row"><div class="main">Quando</div><div class="n">${fdate(p.data)} ${e.cl ? `<span class="badge ${e.cl === 'ritardo' ? 'red' : 'gold'}">${e.top}</span>` : ''}</div></div>
      <div class="row"><div class="main">Tipo</div><div class="n">${esc(p.tipo)}</div></div>
      ${p.prodotto ? `<div class="row"><div class="main">Prodotto</div><div class="n">${esc(p.prodotto)}</div></div>` : ''}
      <div class="row"><div class="main">Dove</div><div class="n">${esc(appName(p.appezzamento_id) || 'Intero uliveto')}</div></div>
      ${p.note ? `<div class="row"><div class="main s" style="white-space:normal">${esc(p.note)}</div></div>` : ''}
    </div>
    <div class="actions"><button class="btn block" onclick="completaPromemoria('${id}')">✓ Fatto: registra il lavoro</button></div>
    <div class="actions"><button class="btn sec" onclick="rimandaPromemoria('${id}',1)">Domani</button><button class="btn sec" onclick="rimandaPromemoria('${id}',7)">+1 settimana</button><button class="btn sec" onclick="formPromemoria('${id}')">Modifica</button></div>`);
}
function completaPromemoria(id){
  const p = S.promemoria.find(x => x.id === id);
  formIntervento(null, [], { _prom:id, tipo:p.tipo, data:today(), descrizione:p.titolo, prodotto:p.prodotto, appezzamento_id:p.appezzamento_id });

async function rimandaPromemoria(id, giorni){
  const p = S.promemoria.find(x => x.id === id);
  const nuova = addDays(giorniDa(p.data) < 0 ? today() : p.data, giorni);
  S._inCoda = false;
  try { await save('promemoria', { data:nuova, notificato_at:null }, id); } catch(e) { return fail(e); }
  closeSheet(); if (S._inCoda) render(); else await refresh(); toast('Rimandato al ' + fdate(nuova));
}

/* ===== Notifiche push ===== */
const pushSupportate = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const iOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let _sw = null;
function registraSW(){
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return Promise.resolve(null);
  return _sw ||= navigator.serviceWorker.register('sw.js').catch(e => { console.warn('SW', e); _sw = null; return null; });
}
function b64ToBytes(b64){ const p = '='.repeat((4 - b64.length % 4) % 4); const raw = atob((b64 + p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
function nomeDispositivo(){ const u = navigator.userAgent; return (/iphone/i.test(u) ? 'iPhone' : /ipad/i.test(u) ? 'iPad' : /android/i.test(u) ? 'Android' : /mac/i.test(u) ? 'Mac' : /windows/i.test(u) ? 'Windows' : 'Browser') + ' · ' + (/edg\//i.test(u) ? 'Edge' : /chrome|crios/i.test(u) ? 'Chrome' : /firefox|fxios/i.test(u) ? 'Firefox' : /safari/i.test(u) ? 'Safari' : ''); }
async function iscrizioneCorrente(){ const reg = await registraSW(); return reg ? reg.pushManager.getSubscription() : null; }
async function disegnaNotifiche(){
  const box = $('#cardNotifiche'); if (!box) return;
  let corpo;
  if (!pushSupportate()) corpo = iOS() && !standalone()
    ? `<div class="muted">Su iPhone le notifiche funzionano solo con l'app aggiunta alla schermata Home: tocca <b>Condividi</b> ⬆︎ in Safari, poi <b>Aggiungi alla schermata Home</b>, e apri l'app da lì.</div>`
    : `<div class="muted">Questo browser non supporta le notifiche. Prova con Chrome o Safari aggiornati.</div>`;
  else if (Notification.permission === 'denied') corpo = `<div class="muted">Le notifiche sono bloccate per questo sito. Riattivale dalle impostazioni del browser (lucchetto accanto all'indirizzo → Notifiche → Consenti), poi torna qui.</div>`;
  else {
    const sub = await iscrizioneCorrente().catch(() => null);
    corpo = sub ? `<div class="riepilogo" style="margin-top:0">✓ Attive su questo dispositivo</div>
        <div class="actions" style="margin-top:0"><button class="btn sec" onclick="provaNotifica()">Invia una prova</button><button class="btn sec" onclick="disattivaNotifiche()">Disattiva qui</button></div>`
      : `<div class="muted" style="margin-bottom:8px">Ricevi gli avvisi del tuo uliveto anche ad app chiusa.</div><button class="btn block" onclick="attivaNotifiche()">🔔 Attiva le notifiche su questo telefono</button>`;
  }
  const pr = (await sb.from('preferenze_notifiche').select('*').eq('user_id', S.user.id).maybeSingle()).data || { meteo:true, promemoria:true, vendite:true, squadra:true };
  const voci = [['meteo','🌤️ Meteo','gelo, pioggia forte, giorni buoni per trattare'],['promemoria','📌 Promemoria','i lavori in programma, il giorno stesso'],
    puo('soldi') && ['vendite','🛒 Vendite','nuovi clienti da approvare e nuovi ordini'], puo('team') && ['squadra','👥 Squadra','lavori e raccolte registrati dai collaboratori']].filter(Boolean);
  if (!$('#cardNotifiche')) return;
  $('#cardNotifiche').innerHTML = `<h2>🔔 Notifiche</h2>${corpo}
    <div style="margin-top:10px">${voci.map(([k,t,d]) => `<label class="switch"><div class="main"><div style="font-weight:600">${t}</div><div class="muted">${d}</div></div>
      <input type="checkbox" ${pr[k] !== false ? 'checked' : ''} onchange="salvaPrefNotifiche('${k}', this.checked)"></label>`).join('')}</div>`;
}
async function salvaPrefNotifiche(k, v){
  const { error } = await sb.from('preferenze_notifiche').upsert({ user_id:S.user.id, [k]:v, updated_at:new Date().toISOString() });
  if (error) return fail(error);
  toast(v ? 'Attivate ✓' : 'Disattivate');
}
async function attivaNotifiche(){
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Permesso non concesso'); return disegnaNotifiche(); }
    const reg = await registraSW(); if (!reg) throw new Error('Servizio notifiche non disponibile su questa pagina');
    await navigator.serviceWorker.ready;
    const { data: chiave, error } = await sb.rpc('chiave_push_pubblica'); if (error || !chiave) throw error || new Error('Chiave non disponibile');
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToBytes(chiave) });
    const j = sub.toJSON();
    const r = await sb.rpc('registra_push', { p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_dispositivo:nomeDispositivo() });
    if (r.error) throw r.error;
    toast('Notifiche attivate ✓'); await disegnaNotifiche(); provaNotifica();
  } catch(e) { fail(e); }
}
async function disattivaNotifiche(){
  const sub = await iscrizioneCorrente();
  if (sub) { await sb.from('push_iscrizioni').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
  toast('Notifiche disattivate su questo dispositivo'); disegnaNotifiche();
}
async function provaNotifica(){
  const { data, error } = await sb.functions.invoke('notifiche', { body:{ azione:'prova' } });
  if (error) return fail(error);
  toast(data?.ok ? 'Notifica di prova inviata 🔔' : 'Nessun dispositivo raggiunto');
}

  { n:2, data:'2026-11-01', titolo:'Meteo e avvio veloce', voci:[
    { ic:'🌤️', t:'Il meteo del tuo terreno', d:'Previsioni a 7 giorni per ogni appezzamento, con avvisi su gelo, pioggia e giorni adatti ai trattamenti.', cta:'Vedi il meteo', vai:() => { S.tab = 'home'; render(); setTimeout(() => $('#meteoCard')?.scrollIntoView({ behavior:'smooth', block:'center' }), 300); } },
    { ic:'⚡', t:'Apertura immediata', d:'L\'app si apre subito con gli ultimi dati e si aggiorna da sola; risolto il blocco dopo qualche ora di inattività.' } ]},
  { n:1, data:'2026-10-31', titolo:'QR code e indirizzi', voci:[
    { ic:'🏷️', t:'Un QR per ogni pianta', d:'Stampa le etichette, appendile ai tronchi e inquadrale per aprire la scheda della pianta.', cta:'Stampa etichette', vai:() => formEtichette() },
    { ic:'📍', t:'Indirizzo e catasto del lotto', d:'Via, comune, foglio e particella di ogni appezzamento, con il link per raggiungerlo.', perm:'struttura' } ]}
];
const ULTIMA_NOVITA = NOVITA[0].n;
const novitaKey = () => 'uliveto:novita:' + S.user?.id;
function novitaVista(){
  let l = 0; try { l = +localStorage.getItem(novitaKey()) || 0; } catch(e){}
  return Math.max(+(S.user?.user_metadata?.novita) || 0, l);
}
function segnaNovita(){
  try { localStorage.setItem(novitaKey(), ULTIMA_NOVITA); } catch(e){}
  if ((+(S.user?.user_metadata?.novita) || 0) < ULTIMA_NOVITA) {    // salvata nell'account: non ricompare su altri dispositivi
    try { sb.auth.updateUser({ data:{ novita:ULTIMA_NOVITA } }).then(r => { if (r.data?.user) S.user = r.data.user; }).catch(() => {}); } catch(e){}
  }
}
const novitaPerMe = (da = 0) => NOVITA.filter(r => r.n > da).map(r => ({ ...r, voci:r.voci.filter(v => !v.perm || puo(v.perm)) })).filter(r => r.voci.length);
function novitaSeNuove(){
  if (!S.user || modoCliente() || $('#novita')) return;
  const vista = novitaVista();
  let guidaVista = false; try { guidaVista = !!localStorage.getItem(guidaKey()); } catch(e){}
  if (!vista && !guidaVista && !S._guidaVista) return segnaNovita();   // nuovo utente: c'è già la guida iniziale
  const rel = novitaPerMe(vista || ULTIMA_NOVITA - 3);                 // chi non ha mai visto la finestra riceve le ultime 3
  if (!rel.length) return segnaNovita();
  setTimeout(() => { if (!$('#guida.open')) apriNovita(rel.slice(0, 3), true); }, 700);
}
let _novitaAperte = [];
function apriNovita(rel, auto){
  _novitaAperte = rel || novitaPerMe(0);
  $('#novita')?.remove();
  const el = document.createElement('div'); el.id = 'novita'; el.className = 'nv-ov'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Cosa c\'è di nuovo');
  el.innerHTML = `<div class="nv">
    <div class="nv-head"><div class="nv-spark"><span>✨</span></div><h2>${auto ? 'Cosa c\'è di nuovo' : 'Novità dell\'app'}</h2>
      <div class="muted">${auto ? 'Dal tuo ultimo accesso' : 'Tutti gli aggiornamenti, dal più recente'}</div></div>
    <div class="nv-body">${_novitaAperte.map((r, ri) => `<section class="nv-rel" style="animation-delay:${.12 + ri * .1}s">
        <div class="nv-rt">${esc(r.titolo)}<span>${fdate(r.data)}</span></div>
        ${r.voci.map((v, vi) => `<div class="nv-voce"><span class="nv-ic">${v.ic}</span><div><b>${esc(v.t)}</b><p>${esc(v.d)}</p>
          ${v.vai ? `<button class="btn sm sec" onclick="novitaVai(${ri},${vi})">${esc(v.cta || 'Prova')} →</button>` : ''}</div></div>`).join('')}
      </section>`).join('')}</div>
    <div class="nv-foot"><button class="btn block" onclick="chiudiNovita()">${auto ? 'Ho capito' : 'Chiudi'}</button></div></div>`;
  el.addEventListener('click', e => { if (e.target === el) chiudiNovita(); });
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('on'));
  document.addEventListener('keydown', novitaTasti);
}
function novitaTasti(e){ if (e.key === 'Escape') chiudiNovita(); }
function chiudiNovita(){
  segnaNovita(); document.removeEventListener('keydown', novitaTasti);
  const el = $('#novita'); if (!el) return;
  el.classList.remove('on'); setTimeout(() => el.remove(), 250);
}
function novitaVai(ri, vi){ const v = _novitaAperte[ri]?.voci[vi]; chiudiNovita(); closeSheet(); if (v?.vai) setTimeout(v.vai, 260); }

/* ===== Guida iniziale ===== */
/* Schermate della guida: [icona, titolo, testo, dove, permesso richiesto]. Testi diversi per titolare, manager e agricoltore. */
function guidaSchermate(){
  const coll = S.owner && S.owner !== S.user?.id, az = accessoAttivo()?.azienda || 'questo uliveto';
  const agr = S.ruolo === 'agricoltore';
  return [
    coll ? ['🫒',`Benvenuto in ${az}`, agr
        ? 'Ti è stato dato accesso come agricoltore: vedi le piante e registri lavori e raccolte dal telefono. Ecco cosa puoi fare.'
        : 'Ti è stato dato accesso come manager: puoi gestire tutto, dalle piante alle vendite. Ecco in breve le funzioni.', null]
      : ['🫒','Benvenuto in Il mio Uliveto','Tutto il ciclo del tuo uliveto in un\'unica app: piante, lavori, raccolta, olio e conti. Ecco in breve cosa puoi fare.',null],
    ['🌳','Ogni pianta ha la sua scheda', agr
        ? 'Apri la scheda di ogni albero per vederne varietà, produzione e storico dei lavori, e aggiornane lo stato se noti qualcosa.'
        : 'Crea le piante anche in blocco (es. da A-1 ad A-80) e segui di ogni albero stato, varietà, produzione e storico dei lavori.','Piante'],
    ['🏷️','Un QR code per ogni albero', agr
        ? 'Sugli alberi trovi un\'etichetta con il QR: inquadrala con la fotocamera e si apre subito la scheda di quella pianta.'
        : 'Stampa le etichette e appendile ai tronchi: inquadrandole con la fotocamera si apre subito la scheda di quella pianta.','Piante → 🏷️ QR'],
    ['🗺️','L\'uliveto sulla mappa','Posiziona le piante con il GPS o toccando la chioma sulla foto satellitare, e colorale per stato di salute o produzione.','Piante → Mappa'],
    ['🧪','Lavori e trattamenti','Registra potature, concimazioni e trattamenti. Con i giorni di carenza l\'app avvisa finché non è il momento di raccogliere.','Campagna → Lavori'],
    agr ? ['🧺','Raccolta','Registra i chili di olive raccolti, pianta per pianta o per appezzamento. Vedi anche le moliture e la resa in olio.','Campagna → Raccolta']
        : ['🧺','Raccolta e frantoio','Pesa le olive pianta per pianta e registra la molitura: resa e costo al litro dell\'olio si calcolano da soli.','Campagna → Raccolta'],
    ['🔔','Avvisi sul telefono','Attiva le notifiche da ⚙︎: ti avvisiamo di gelate e piogge in arrivo, dei lavori in programma e, se gestisci le vendite, di nuovi clienti e ordini. Su iPhone aggiungi prima l\'app alla schermata Home.','⚙︎ → Notifiche'],
    ['📌','Promemoria dei lavori','Programma i lavori da fare, come un trattamento da ripetere tra 15 giorni: il giorno stesso arriva l\'avviso a tutta la squadra.','Campagna → Lavori'],
    ['🌤️','Il meteo del terreno','Previsioni a 7 giorni dove si trova l\'appezzamento, con avvisi su gelate, piogge e giorni adatti ai trattamenti.','Annata'],
    ['🛒','Vendi l\'olio','Personalizza la vetrina, manda il link ai clienti e autorizzali: prenotano, accumulano punti oliva, e tu decidi il prezzo su ogni ordine.','Olio → Ordini e Vetrina','soldi'],
    ['🛢️','Il magazzino dell\'olio','Quanto olio ti resta, annata per annata. Aggiungi anche quello degli anni precedenti, scegli quanti litri mettere in vendita e l\'app tiene il conto di prenotati e rimanenti.','Olio → Magazzino','soldi'],
    ['💶','I conti dell\'annata','Spese ed entrate per categoria, con il saldo dell\'anno: i costi di lavori e frantoio e gli incassi delle vendite entrano in automatico.','Annata → Conti','soldi'],
    ['👥','Lavora in squadra','Invita un manager o chi lavora in campo: il manager gestisce tutto, l\'agricoltore registra lavori e raccolte senza vedere conti e vendite. Puoi revocare l\'accesso quando vuoi.','⚙︎ → Collaboratori','team'],
    coll ? ['🚀','Iniziamo!', agr ? 'Quando finisci un lavoro in campo, registralo subito con il pulsante +: così resta nello storico dell\'uliveto e lo vede anche il titolare.' : 'Trovi tutto nelle schede in basso. Consiglio: aggiungi l\'app alla schermata Home dal menu del browser.', null]
      : ['🚀','Iniziamo!','Primo passo: crea l\'appezzamento con l\'indirizzo del terreno, poi aggiungi le piante. Consiglio: aggiungi l\'app alla schermata Home dal menu del browser.',null]
  ].filter(x => !x[4] || puo(x[4]));
}
let GUIDA = [];
const guidaKey = () => 'uliveto:guida:' + S.user?.id;
function apriGuida(){
  GUIDA = guidaSchermate();
  let g = $('#guida'); if (!g) { g = document.createElement('div'); g.id = 'guida'; g.setAttribute('role','dialog'); g.setAttribute('aria-label','Guida dell\'app'); document.body.appendChild(g); }
  g.innerHTML = `<button class="g-skip" onclick="chiudiGuida()">Salta</button>
    <div class="g-track" id="gTrack">${GUIDA.map(([e,t,d,dove])=>`<section class="g-slide"><div class="g-ill"><span>${e}</span></div><h2>${esc(t)}</h2><p>${esc(d)}</p>${dove?`<div class="g-dove">Dove: <b>${esc(dove)}</b></div>`:''}</section>`).join('')}</div>
    <div class="g-foot"><div class="g-dots">${GUIDA.map((_,i)=>`<i onclick="guidaVai(${i})" aria-label="Schermata ${i+1}"></i>`).join('')}</div>
      <button class="btn" id="gNext" onclick="guidaAvanti()">Avanti</button></div>`;
  g.classList.add('open');
  const tr = $('#gTrack'); tr.scrollLeft = 0; tr.addEventListener('scroll', guidaAgg, { passive:true }); guidaAgg();
  document.addEventListener('keydown', guidaTasti);
}
function guidaIdx(){ const tr = $('#gTrack'); return tr ? Math.round(tr.scrollLeft / tr.clientWidth) : 0; }
function guidaAgg(){
  const i = guidaIdx();
  document.querySelectorAll('.g-dots i').forEach((d,k)=>d.classList.toggle('on', k===i));
  document.querySelectorAll('.g-slide').forEach((sl,k)=>sl.classList.toggle('on', k===i));
  const b = $('#gNext'); if (b) b.textContent = i === GUIDA.length-1 ? (!S.appezzamenti.length && puo('struttura') ? 'Crea appezzamento' : 'Inizia') : 'Avanti';
}
function guidaVai(i){ const tr = $('#gTrack'); tr.scrollTo({ left: i * tr.clientWidth, behavior:'smooth' }); }
function guidaAvanti(){ const i = guidaIdx(); if (i >= GUIDA.length-1) return chiudiGuida(true); guidaVai(i+1); }
function guidaTasti(e){ if (!$('#guida.open')) return; if (e.key==='ArrowRight') guidaAvanti(); if (e.key==='ArrowLeft') guidaVai(Math.max(0, guidaIdx()-1)); if (e.key==='Escape') chiudiGuida(); }
function chiudiGuida(inizia){
  try { localStorage.setItem(guidaKey(), '1'); } catch(e){}
  S._guidaVista = true; document.removeEventListener('keydown', guidaTasti);
  $('#guida')?.classList.remove('open');
  if (inizia && !S.appezzamenti.length && puo('struttura')) setTimeout(formAppezzamento, 250);
}
function guidaSeNuova(){
  if (!S.user || S._guidaVista) return;
  let vista = false; try { vista = !!localStorage.getItem(guidaKey()); } catch(e){}
  if (!vista) setTimeout(apriGuida, 350);
}

/* ===== Autenticazione ===== */
let authMode = 'login';
function renderAuth(){
  const shop = !!SHOP_PARAM;
  if (shop && INVITO_PARAM && authMode === 'login' && !renderAuth._inv) { renderAuth._inv = true; authMode = 'signup'; }
  $('#app').innerHTML = `<div class="auth"><div class="logo">🫒</div>
    ${shop ? `<h1 id="shopNome">Prenota l'olio</h1><p id="shopDesc">Accedi o crea un account per chiedere di poter prenotare l'olio di questa annata.</p>`
           : `<h1>Il mio Uliveto</h1><p>Piante, lavori, raccolta, olio e conti in un solo posto.</p>`}
    <form id="authf" class="card">
      <label class="f"><span>Email</span><input name="email" type="email" required autocomplete="email"></label>
      <label class="f"><span>Password</span><input name="password" type="password" required minlength="6" autocomplete="${authMode==='login'?'current-password':'new-password'}"></label>
      ${authMode==='signup' ? `<label class="chk" style="text-align:left"><input type="checkbox" name="termini" required> Ho letto e accetto i ${linkLeg('termini','Termini e condizioni')} e ho letto l'${linkLeg('privacy','Informativa privacy')}.</label>` : ''}
      <button class="btn block" type="submit">${authMode==='login'?'Accedi':'Crea account'}</button>
    </form>
    <button class="link" onclick="authMode=authMode==='login'?'signup':'login';renderAuth()">${authMode==='login'?'Prima volta? Crea un account':'Hai già un account? Accedi'}</button>
    ${authMode==='login'?'<button class="link" style="font-weight:400;color:var(--muted)" onclick="resetPwd()">Password dimenticata?</button>':''}
    ${piedeLegale(shop)}</div>`;
  apriLegaleDaLink();
  $('#authf').onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(e.target);
    const creds = { email: fd.get('email'), password: fd.get('password') };
    const opts = { emailRedirectTo: APP_URL };
    if (shop) opts.data = { ruolo:'cliente', negozio: SHOP_PARAM.toLowerCase() };
    if (authMode === 'signup') opts.data = { ...(opts.data || {}), termini:LEGALE.versione, termini_at:new Date().toISOString() };
    const { data, error } = authMode==='login' ? await sb.auth.signInWithPassword(creds) : await sb.auth.signUp({ ...creds, options:opts });
    if (error) return fail(error);
    if (authMode==='signup' && !data.session) toast('Controlla la tua email per confermare l\'account, poi accedi.');
  };
  if (shop) sb.rpc('vetrina_pubblica', { p_slug: SHOP_PARAM }).then(({ data }) => {
    if (!data || !$('#shopNome')) return;
    LEG_NEG = data;
    $('.auth').classList.add('con-vetrina');
    $('.auth').insertAdjacentHTML('afterbegin', htmlVetrina(data));
    $('#shopNome').textContent = 'Prenota il nostro olio';
    $('#shopDesc').textContent = INVITO_PARAM ? 'Sei stato invitato: crea l\'account (o accedi) e troverai i tuoi dati già inseriti. Potrai prenotare subito.'
      : 'Accedi o crea un account per chiedere di poter prenotare. Chi viene autorizzato riceve 50 punti oliva di benvenuto.';
  });
}

const APP_URL = location.origin + location.pathname;
async function resetPwd(){
  const email = ($('#authf [name=email]')?.value || '').trim();
  if (!email) return toast('Scrivi prima la tua email nel campo sopra');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: APP_URL });
  if (error) return fail(error);
  toast('Ti abbiamo inviato una mail per reimpostare la password');
}
function nuovaPassword(){
  openForm({ title:'Imposta una nuova password', fields:[{name:'password',label:'Nuova password (almeno 6 caratteri)',type:'password',required:true}],
    onSubmit: async v=>{ if ((v.password||'').length < 6) throw new Error('Almeno 6 caratteri'); const { error } = await sb.auth.updateUser({ password:v.password }); if (error) throw error; } });
}

// Il callback resta sincrono: le chiamate a Supabase partono dopo, con setTimeout,
// altrimenti durante il rinnovo della sessione si bloccano a vicenda.
sb.auth.onAuthStateChange((_e, session) => {
  if (_e === 'PASSWORD_RECOVERY') setTimeout(nuovaPassword, 400);
  const u = session?.user || null;
  if (S._init && u?.id === S.user?.id) return;
  S._init = true; S.user = u;
  setTimeout(avvia, 0);
});
async function avvia(){
  S._lastTab = null;
  if (S.user) setTimeout(controllaTermini, 1500);
  if (!S.user) { CACHE_TAB.forEach(t=>S[t]=[]); S._caricato = false; S._daCache = false; return render(); }
  if (modoCliente()) {
    showSplash();
    try { await avviaCliente(); } catch(e) { console.error(e); splashError('Non riesco a caricare il negozio. Controlla la connessione.'); }
    return;
  }
  const pref = leggiPref();
  S.owner = pref?.owner || S.user.id; S.ruolo = pref?.ruolo || 'owner';
  const c = leggiCache();
  if (c) {
    Object.assign(S, c); S._daCache = true; S._caricato = true; render(); apriDaLink(); guidaSeNuova();
    const prima = S.owner; await aggiornaAccessi();
    if (S.owner !== prima) { svuotaStato(); showSplash(); }
    refresh(); novitaSeNuove(); return;  // refresh invia prima gli eventuali salvataggi in coda
  }
  showSplash(); await aggiornaAccessi(); await refresh();
  if (!S._caricato) splashError('Non riesco a caricare i dati. Controlla la connessione.');
  else { guidaSeNuova(); novitaSeNuove(); }
}
</script>
