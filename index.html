<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4d5a2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Uliveto">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Il mio Uliveto</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://dhtlqdlhglsbguxokpxx.supabase.co" crossorigin>
<style>
:root{
  --bg:#f6f4ec; --card:#ffffff; --ink:#26291c; --muted:#6f735f; --line:#e3e0d2;
  --olive:#4d5a2c; --olive-2:#76863f; --olive-soft:#e8ecd6; --gold:#c9a227; --gold-soft:#f6eccb;
  --red:#a8432f; --red-soft:#f6e1db; --blue:#3f6b7a;
  --r:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#161812; --card:#20231a; --ink:#ecebe2; --muted:#a3a690; --line:#33372a;
    --olive:#a4b56a; --olive-2:#8c9c52; --olive-soft:#2b3220; --gold:#ddb94a; --gold-soft:#3a3420;
    --red:#e08a73; --red-soft:#3d2620; --blue:#8bb6c4; --shadow:none;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:-.2px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 span{color:var(--olive)}
header h1 .ruolo{font-size:11px;font-weight:700;background:var(--olive-soft);color:var(--olive);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:3px;letter-spacing:0}
.invito{background:var(--olive-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;margin:6px 0 10px;white-space:pre-wrap}
main{padding:14px 16px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--olive);font-weight:600}
nav.tabs .tab-add{flex:0 0 72px;display:grid;place-items:center;padding:0}
nav.tabs .tab-add span{width:52px;height:52px;margin-top:-20px;border-radius:18px;background:var(--olive);color:#fff;font-size:30px;line-height:52px;box-shadow:0 6px 16px -4px rgba(0,0,0,.35);border:4px solid var(--card)}
nav.tabs .tab-add:active span{transform:scale(.92)}
.sottomenu{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:5;background:var(--bg);padding:10px 16px 2px;max-width:720px;margin:0 auto}
.sottomenu .seg{margin-bottom:0}
.sottomenu .seg button{font-size:13.5px;padding:8px 4px;white-space:nowrap}
.kpi.tap{cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.4px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .d{font-size:11px;color:var(--muted);margin-top:2px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .n{font-weight:600;white-space:nowrap}
.tap{cursor:pointer}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--olive-soft);color:var(--olive);font-weight:600;white-space:nowrap}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.grey{background:var(--line);color:var(--muted)}
.btn{border:0;border-radius:11px;padding:11px 16px;background:var(--olive);color:#fff;font-weight:600;cursor:pointer}
@media (prefers-color-scheme: dark){.btn{color:#161812}}
.btn.sec{background:var(--olive-soft);color:var(--olive)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.iconbtn{border:0;background:var(--olive-soft);color:var(--olive);width:36px;height:36px;border-radius:10px;font-size:17px;cursor:pointer}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:18px;border:0;background:var(--olive);color:#fff;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
@media (prefers-color-scheme: dark){.fab{color:#161812}}
select.year{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--olive);border-color:var(--olive);color:#fff}
@media (prefers-color-scheme: dark){.chip.on{color:#161812}}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;margin-bottom:10px}
.empty{color:var(--muted);text-align:center;padding:18px 6px;font-size:14px}
.warn{background:var(--gold-soft);border:1px solid transparent;color:var(--ink)}
.warn h2{color:var(--gold)}
.carenza{margin-top:6px;display:inline-block;font-size:12.5px;background:var(--card);color:var(--ink);border-radius:8px;padding:4px 9px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.bars .b i{display:block;width:100%;max-width:38px;background:var(--olive-2);border-radius:6px 6px 2px 2px;min-height:2px}
.bars .b.cur i{background:var(--olive)}
.bars .b small{font-size:10.5px;color:var(--muted)}
.bars .b em{font-size:10.5px;font-style:normal;font-weight:600}
.season li{margin:3px 0}
.season{margin:0;padding-left:18px;font-size:14px}
.muted{color:var(--muted);font-size:12.5px}
/* vista lista/mappa */
.seg{display:flex;background:var(--olive-soft);border-radius:11px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;color:var(--olive);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#map{height:58vh;min-height:320px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:8px;position:relative;z-index:0}
#map.placing{outline:3px solid var(--gold);outline-offset:2px;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:0 2px 12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
/* Leaflet: regole essenziali */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;touch-action:none;background:#d9dccb;outline:0;font:12px/1.4 -apple-system,sans-serif}
.leaflet-container img{max-width:none!important;max-height:none!important}
.leaflet-tile{user-select:none;-webkit-user-drag:none;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-overlay-pane svg{max-width:none!important}
.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto;cursor:pointer}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-bar{background:#fff;border-radius:9px;box-shadow:0 1px 5px rgba(0,0,0,.3);overflow:hidden}
.leaflet-bar a{display:block;width:36px;height:36px;line-height:36px;text-align:center;color:#333;text-decoration:none;font:bold 19px sans-serif;border-bottom:1px solid #ddd}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-control-attribution{background:rgba(255,255,255,.75);color:#333;padding:0 5px;font-size:10px}
.leaflet-control-attribution a{color:#333}
.sug{display:flex;flex-direction:column;margin:-6px 0 8px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.sug:empty{display:none}
.sug button{border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.sug button:first-child{border-top:0}
.sug button span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug button:active{background:var(--olive-soft)}
.gmaps{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:-4px 0 14px}
.gm-titolo{font-size:13.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.gm-riga{display:flex;gap:8px}
.gm-riga input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:14px}
.gm-aiuto{margin-top:8px;font-size:12.5px;color:var(--muted)}
.gm-aiuto summary{cursor:pointer;color:var(--olive);font-weight:600}
.gm-aiuto ol{margin:6px 0 0;padding-left:18px;line-height:1.5}
.addrbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-2px 0 12px;font-size:12.5px}
.meteo-now{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.meteo-now .e{font-size:42px;line-height:1}
.meteo-now .temp{font-size:32px;font-weight:700;letter-spacing:-.5px}
.meteo-now .det{font-size:12.5px;color:var(--muted);line-height:1.5}
.days{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.day{flex:0 0 58px;text-align:center;background:var(--olive-soft);border-radius:11px;padding:7px 2px;font-size:12px;line-height:1.35}
.day .e{font-size:21px;display:block;margin:2px 0}
.day b{display:block}
.day .r{color:var(--blue);font-size:11px;min-height:15px}
.day.ok{box-shadow:inset 0 0 0 2px var(--olive-2)}
.day.gelo{box-shadow:inset 0 0 0 2px #5b8fd6}
.hints{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px}
.hints li{padding:7px 0;border-top:1px solid var(--line)}
.lotto-pin{background:none;border:0}
.lotto-pin div{transform:translate(-50%,-100%);display:inline-block;white-space:nowrap;background:#fff;color:#26291c;border-radius:10px;padding:3px 8px;font:700 12px/1.3 -apple-system,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.leaflet-tooltip{position:absolute;padding:1px 6px;background:rgba(20,22,15,.78);color:#fff;border-radius:6px;font:600 11px/1.4 -apple-system,sans-serif;white-space:nowrap;pointer-events:none;visibility:hidden}
.labels .leaflet-tooltip{visibility:visible}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheet .panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
#sheet h3{margin:0 0 12px;font-size:18px}
label.f{display:block;margin-bottom:11px}
label.f span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
label.f input,label.f select,label.f textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 11px}
label.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);margin:-6px 0 10px}
.plist{border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:220px;overflow:auto;padding:4px 10px}
.plist label{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.plist label:first-child{border-top:0}
.plist input[type=checkbox]{width:18px!important;height:18px;flex:0 0 auto;margin:0}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}
.qrbox{background:#fff;border-radius:12px;padding:10px;width:190px;margin:0 auto 8px;border:1px solid var(--line)}
.qrbox svg{width:100%;height:auto;display:block}
#print{display:none}
@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff!important}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000}
  .labels{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
  .lab{border:1px dashed #888;border-radius:3mm;padding:4mm 3mm;text-align:center;break-inside:avoid;height:64mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5mm}
  .lab svg{width:40mm;height:40mm;display:block}
  .lab b{font:700 17pt/1.1 -apple-system,Arial,sans-serif}
  .lab small{font:8pt/1.2 -apple-system,Arial,sans-serif;color:#333}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:90vw}
/* splash di caricamento */
.splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);transition:opacity .45s ease, visibility .45s}
.splash.out{opacity:0;visibility:hidden}
.splash svg{width:132px;height:132px;overflow:visible}
.splash .branch{fill:none;stroke:var(--olive);stroke-width:7;stroke-linecap:round;stroke-dasharray:260;stroke-dashoffset:260;animation:sp-draw 1s ease-out .1s forwards}
.splash .leaf{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:sp-grow .55s cubic-bezier(.3,1.6,.5,1) forwards}
.splash .leaf.l1{animation-delay:.45s}.splash .leaf.l2{animation-delay:.65s}.splash .leaf.l3{animation-delay:.85s}.splash .leaf.l4{animation-delay:1.05s}
.splash .olive{transform-box:view-box;transform-origin:118px 96px;opacity:0;animation:sp-drop .7s cubic-bezier(.3,1.4,.5,1) 1.15s forwards, sp-sway 2.2s ease-in-out 1.9s infinite}
.splash .olive2{animation-delay:1.35s, 2.1s}
.splash .name{font-size:22px;font-weight:700;letter-spacing:-.3px;color:var(--ink);opacity:0;animation:sp-fade .5s ease .9s forwards}
.splash .name span{color:var(--olive)}
.splash .msg{font-size:13.5px;color:var(--muted);height:18px;transition:opacity .25s}
.splash .bar{width:150px;height:4px;border-radius:4px;background:var(--olive-soft);overflow:hidden;position:relative}
.splash .bar i{position:absolute;inset:0;width:40%;border-radius:4px;background:linear-gradient(90deg,var(--olive-2),var(--gold));animation:sp-bar 1.1s ease-in-out infinite}
.splash .retry{display:none}
.splash.error .bar{display:none}.splash.error .retry{display:block}
@keyframes sp-draw{to{stroke-dashoffset:0}}
@keyframes sp-grow{to{transform:scale(1)}}
@keyframes sp-drop{0%{opacity:0;transform:translateY(-22px)}60%{opacity:1;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
@keyframes sp-sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes sp-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sp-bar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
/* ingresso delle schermate */
main.enter>*,main.enter #view>*{animation:rise .42s cubic-bezier(.2,.8,.3,1) both}
main.enter #view>*:nth-child(2){animation-delay:.05s}main.enter #view>*:nth-child(3){animation-delay:.1s}
main.enter #view>*:nth-child(4){animation-delay:.15s}main.enter #view>*:nth-child(5){animation-delay:.2s}
main.enter #view>*:nth-child(6){animation-delay:.25s}main.enter #view>*:nth-child(n+7){animation-delay:.3s}
.kpis .kpi{transition:transform .15s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#sheet.open .panel{animation:sheet-up .3s cubic-bezier(.2,.8,.3,1)}
@keyframes sheet-up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.btn,.chip,.iconbtn,.fab,nav.tabs button,.row.tap{transition:transform .12s ease, background-color .2s}
.btn:active,.chip:active,.iconbtn:active,.fab:active,.kpi:active{transform:scale(.96)}
nav.tabs button:active .ic{transform:scale(.85)}
nav.tabs button .ic{transition:transform .15s}
nav.tabs button.on .ic{animation:tab-pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes tab-pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .splash .branch{stroke-dashoffset:0}.splash .leaf{transform:none}.splash .olive,.splash .name{opacity:1}
}
/* vetrina */
.vt{--acc:#4d5a2c;--acc-soft:#e8ecd6;margin-bottom:12px}
.vt-hero{position:relative;border-radius:var(--r);overflow:hidden;min-height:210px;display:flex;align-items:flex-end;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#c9a227));background-size:cover;background-position:center;color:#fff;margin-bottom:12px}
.vt-hero.mini{min-height:130px}
.vt-hero.foto::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.65))}
.vt-hero-in{position:relative;padding:18px 18px 16px}
.vt-kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.vt-hero h1{font:600 30px/1.1 "Lora",Georgia,serif;margin:6px 0 0;letter-spacing:-.3px}
.vt-hero p{margin:8px 0 0;font-size:14.5px;line-height:1.45;opacity:.95;color:#fff!important}
.auth .vt{text-align:left}
.vt-annata{display:flex;gap:12px;align-items:flex-start;background:var(--acc-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.vt-annata>span{font-size:26px}.vt-annata b{color:var(--acc)}.vt-annata p{margin:2px 0 0;font-size:14px}
.vt-sez{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.vt-sez h2{font:600 19px/1.2 "Lora",Georgia,serif;margin:0 0 8px;color:var(--acc)}
.vt-testo{margin:0;font-size:14.5px;line-height:1.55;white-space:pre-line}
.vt-gal{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.vt-gal img{height:150px;width:auto;max-width:80%;border-radius:12px;object-fit:cover;scroll-snap-align:start;flex:0 0 auto}
.vt-prod{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.vt-sez .vt-prod:first-of-type,.card h2+.vt-prod{border-top:0}
.vt-prod img,.vt-ph{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:var(--acc-soft,var(--olive-soft));display:grid;place-items:center;font-size:28px}
.vt-prod .main{flex:1;min-width:0}.vt-prod p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.vt-disp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:14px}
.vt-wa{background:#1f8a4c!important;color:#fff!important;text-decoration:none;text-align:center;display:block;margin-bottom:12px}
.vt-mini{height:120px;border-radius:12px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#c9a227));background-size:cover;background-position:center;display:flex;align-items:flex-end;color:#fff;position:relative;overflow:hidden}
.vt-mini::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55))}
.vt-mini div{position:relative;padding:10px 12px}.vt-mini small{display:block;font-size:11px;opacity:.9}.vt-mini b{font:600 19px "Lora",Georgia,serif}
.vt-cop-ed{height:140px;border-radius:12px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#c9a227));background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-size:13px}
.swatch{display:flex;gap:10px;margin-top:8px}.swatch button{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatch button.on{box-shadow:0 0 0 3px var(--gold)}
.gal-ed{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gal-ed>div{aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center;position:relative}
.gal-ed>div button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer}
.gal-add{aspect-ratio:1;border-radius:10px;border:2px dashed var(--line);background:none;color:var(--olive);font-size:24px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gal-add span{font-size:11px;font-weight:600}
.foto-formato{display:flex;align-items:center;gap:12px;margin:-2px 0 6px}
.foto-formato>div{width:64px;height:64px;border-radius:12px;background:var(--olive-soft) center/cover;display:grid;place-items:center;font-size:28px}
.anteprima-banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--gold-soft);border:0;font-size:13.5px}
.auth.con-vetrina{max-width:560px;margin-top:20px}
.auth.con-vetrina .logo{display:none}
/* area clienti: bacheca e punti */
.seg3 button{font-size:13.5px;padding:8px 4px;position:relative}
.nb-in{position:static;display:inline-block;margin-left:4px;vertical-align:1px}
.chip-punti{border:0;background:var(--gold-soft);color:var(--ink);font-weight:700;font-size:14px;border-radius:99px;padding:7px 12px;cursor:pointer}
.annuncio{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.annuncio.nuovo{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.an-emoji{font-size:30px;line-height:1}
.an-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.an-top span{font-size:12px;color:var(--muted);white-space:nowrap}
.annuncio p{margin:6px 0 0;font-size:14px;line-height:1.5;white-space:pre-line}
.punti-card{--acc:#4d5a2c;--acc-soft:#e8ecd6;background:linear-gradient(140deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#c9a227));color:#fff;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 12px 30px -14px rgba(0,0,0,.4)}
.pc-top{display:flex;align-items:center;gap:14px}
.pc-ic{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:36px;animation:g-float 3s ease-in-out infinite}
.pc-liv{font:600 22px "Lora",Georgia,serif}.pc-num{font-size:14px;opacity:.95}.pc-num b{font-size:22px}
.pc-bar{height:10px;border-radius:99px;background:rgba(255,255,255,.25);margin:16px 0 8px;overflow:hidden}
.pc-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f6eccb,#c9a227);animation:pc-cresci 1.1s cubic-bezier(.2,.8,.3,1) both}
@keyframes pc-cresci{from{width:0}}
.pc-sotto{font-size:13.5px}
.pc-stat{display:flex;gap:18px;margin-top:12px;font-size:12.5px;opacity:.9}
.livello{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);opacity:.55}
.livello:first-of-type{border-top:0}.livello.preso{opacity:1}
.lv-ic{font-size:26px}.lv-ok{color:var(--olive);font-weight:800}
.lv-premio{font-size:13px;margin-top:3px;color:var(--ink)}
.pt-guadagnati{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:3px 10px}
/* cosa c'è di nuovo */
.nv-ov{position:fixed;inset:0;z-index:42;background:rgba(20,22,15,0);display:flex;align-items:flex-end;justify-content:center;transition:background .25s}
.nv-ov.on{background:rgba(20,22,15,.45)}
.nv{background:var(--bg);width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.nv-ov.on .nv{transform:none}
@media (min-width:600px){.nv-ov{align-items:center}.nv{border-radius:24px;transform:translateY(30px) scale(.97);opacity:0;transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .25s}.nv-ov.on .nv{opacity:1}}
.nv-head{text-align:center;padding:22px 20px 10px}
.nv-head h2{font-size:22px;margin:10px 0 3px;letter-spacing:-.3px}
.nv-spark{width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--gold-soft),var(--olive-soft) 75%);font-size:32px}
.nv-ov.on .nv-spark span{display:inline-block;animation:nv-pop .7s cubic-bezier(.3,1.6,.5,1) .15s both, g-float 3s ease-in-out .9s infinite}
@keyframes nv-pop{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.nv-body{overflow:auto;padding:4px 18px 6px}
.nv-rel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.nv-ov.on .nv-rel{animation:rise .45s cubic-bezier(.2,.8,.3,1) both}
.nv-rt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:14px;color:var(--olive);margin-bottom:4px}
.nv-rt span{font-weight:500;font-size:12px;color:var(--muted)}
.nv-voce{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.nv-voce:first-of-type{border-top:0}
.nv-ic{font-size:26px;line-height:1.2;flex:0 0 auto}
.nv-voce b{font-size:15px}
.nv-voce p{margin:3px 0 0;color:var(--muted);font-size:13.5px;line-height:1.45}
.nv-voce .btn{margin-top:8px}
.nv-foot{padding:10px 18px calc(16px + env(safe-area-inset-bottom))}
/* guida iniziale */
#guida{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
#guida.open{display:flex;animation:g-in .35s ease}
.g-skip{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;border:0;background:none;color:var(--muted);font-weight:600;font-size:15px;padding:10px;z-index:2;cursor:pointer}
.g-track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.g-track::-webkit-scrollbar{display:none}
.g-slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 28px 8px;box-sizing:border-box}
.g-ill{width:172px;height:172px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-soft),var(--olive-soft) 70%);display:grid;place-items:center;margin-bottom:30px;position:relative}
.g-ill::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px dashed var(--olive-soft);animation:g-spin 30s linear infinite}
.g-ill span{font-size:78px;line-height:1;display:block}
.g-slide.on .g-ill span{animation:g-pop .6s cubic-bezier(.3,1.6,.5,1) both, g-float 3.2s ease-in-out .6s infinite}
.g-slide h2{font-size:24px;margin:0 0 10px;letter-spacing:-.4px;line-height:1.2}
.g-slide p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.55;max-width:340px}
.g-slide.on h2,.g-slide.on p,.g-slide.on .g-dove{animation:rise .5s cubic-bezier(.2,.8,.3,1) both}
.g-slide.on p{animation-delay:.08s}.g-slide.on .g-dove{animation-delay:.16s}
.g-dove{margin-top:18px;font-size:13px;background:var(--olive-soft);color:var(--olive);padding:6px 13px;border-radius:99px}
.g-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px calc(22px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto;box-sizing:border-box}
.g-dots{display:flex;gap:6px;flex-wrap:wrap}
.g-dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:width .25s, background .25s;cursor:pointer}
.g-dots i.on{width:22px;background:var(--olive)}
.g-foot .btn{min-width:124px}
@keyframes g-in{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
@keyframes g-pop{0%{transform:scale(.3) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes g-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes g-spin{to{transform:rotate(360deg)}}
/* vendite e area clienti */
nav.tabs button .ic{position:relative}
.nb{position:absolute;top:-5px;right:-11px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font:700 10.5px/17px -apple-system,sans-serif;font-style:normal;text-align:center}
.st{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st-richiesta,.st-in_attesa{background:var(--gold-soft);color:var(--gold)}
.st-confermato,.st-approvato{background:var(--olive-soft);color:var(--olive)}
.st-in_consegna{background:#dfeaf3;color:var(--blue)}
.st-consegnato{background:var(--olive);color:#fff}
.st-annullato,.st-rifiutato,.st-bloccato{background:var(--line);color:var(--muted)}
.shoplink{display:flex;gap:8px;align-items:center;background:var(--olive-soft);border-radius:10px;padding:8px 10px;font-size:12.5px;word-break:break-all;margin-bottom:10px}
.prod{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.prod:first-of-type{border-top:0}
.prod .main{flex:1;min-width:0}
.step{display:flex;align-items:center;gap:4px}
.step button{width:36px;height:36px;border-radius:10px;border:0;background:var(--olive-soft);color:var(--olive);font-size:20px;font-weight:700;cursor:pointer}
.step b{min-width:26px;text-align:center;font-size:17px}
.riepilogo{background:var(--olive-soft);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.righe-ord{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 8px}
.righe-ord td{padding:7px 0;border-top:1px solid var(--line);vertical-align:middle}
.righe-ord input{width:84px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 8px;text-align:right}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding:8px 0;border-top:2px solid var(--line)}
.ordcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--card)}
.ordcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.privacy{font-size:12px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px;margin:4px 0 10px;line-height:1.45}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin-bottom:12px}
label.chk input{margin-top:3px;width:18px;height:18px}
/* promemoria e notifiche */
.prom-data{min-width:54px;text-align:center;border-radius:10px;padding:5px 4px;background:var(--olive-soft);color:var(--olive);font-size:11px;font-weight:700;line-height:1.2}
.prom-data b{display:block;font-size:17px}
.prom-data.oggi{background:var(--gold-soft);color:var(--gold)}
.prom-data.ritardo{background:var(--red-soft);color:var(--red)}
.switch{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.switch:first-of-type{border-top:0}
.switch .main{flex:1}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--olive)}
.switch input:checked::after{transform:translateX(18px)}
/* auth */
.auth{max-width:380px;margin:12vh auto 0;padding:0 20px}
.auth .logo{font-size:44px;text-align:center}
.auth h1{text-align:center;margin:6px 0 4px}
.auth p{text-align:center;color:var(--muted);margin:0 0 22px}
.auth .vt p{text-align:left;margin:0;color:inherit}.auth .vt .vt-hero p{margin-top:8px}.auth .vt .vt-annata p,.auth .vt .vt-prod p{margin-top:4px}.auth .vt .vt-prod p{color:var(--muted)}
.link{background:none;border:0;color:var(--olive);font-weight:600;cursor:pointer;padding:8px;width:100%}


/* oggi, moduli più corti, appezzamenti, rete */
.oggi h2{margin-bottom:6px}
.oggi-data{font-weight:500;font-size:12.5px;color:var(--muted);text-transform:capitalize}
.oggi-az{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.oggi-az .btn{flex:1 1 auto;white-space:nowrap}
.oggi-az .btn:first-child{flex-basis:100%}
.avviso-carenza .t{color:var(--red)}
.sez-tit{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 4px 8px;font-weight:700}
.passi{margin:0 0 6px;padding-left:20px;font-size:14px;line-height:1.5}.passi li{margin:4px 0}
.passi li.fatto{color:var(--muted);text-decoration:line-through}
details.altro{border:1px solid var(--glass-brd,var(--line));border-radius:14px;background:var(--glass,var(--card));margin:2px 0 12px;box-shadow:var(--glass-hi,none)}
details.altro summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;font-size:14px;color:var(--olive);display:flex;align-items:center;gap:6px}
details.altro summary::-webkit-details-marker{display:none}
details.altro summary::after{content:"›";margin-left:auto;font-size:20px;line-height:1;transition:transform .2s}
details.altro[open] summary::after{transform:rotate(90deg)}
.altro-in{padding:0 14px 4px}
[data-gruppo][hidden]{display:none}
.seg-piante button{font-size:13px;padding:8px 2px;white-space:nowrap}
.lotto .s{font-size:13px;color:var(--muted)}
.lotto .actions .btn,.passi+.actions .btn,.empty .actions .btn{white-space:nowrap;text-decoration:none}
a.btn{text-decoration:none;display:inline-block}
.spia{border:0;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;background:var(--red-soft);color:var(--red)}
.spia.attesa{background:var(--gold-soft);color:#7a5d00}
@media (prefers-color-scheme: dark){.spia.attesa{color:var(--gold)}}

/* chiusura dei fogli */
#sheet .panel{max-height:86vh;padding-top:0}
.sheet-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:center;height:44px;margin:0 -16px 4px;padding:0 12px;
  background:var(--bg);border-radius:28px 28px 0 0;box-shadow:0 1px 0 var(--glass-brd,var(--line));cursor:grab;touch-action:none}
.sheet-top .grab{margin:0;width:44px;height:5px}
.sheet-x{position:absolute;right:12px;top:6px;width:34px;height:34px;border-radius:50%;border:1px solid var(--glass-brd,var(--line));background:var(--glass-2,var(--card));
  color:var(--ink);font-size:15px;line-height:1;cursor:pointer;box-shadow:var(--glass-hi,none)}
.sheet-x:active{transform:scale(.92)}
#sheet h3{padding-right:40px}

/* piante: stato, posizione, vuoti */
.riga-pianta{gap:12px}
.pallino{display:inline-block;width:12px;height:12px;border-radius:50%;flex:0 0 12px;box-shadow:0 0 0 2px rgba(255,255,255,.7),0 1px 3px rgba(0,0,0,.2)}
.chev{color:var(--muted);font-size:20px;line-height:1;margin-left:2px}
.legenda-stati{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.legenda-stati .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px}
.legenda-stati .pallino{width:10px;height:10px;flex-basis:10px}
.stato-pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;text-transform:capitalize}
.stato-pill i{width:10px;height:10px;border-radius:50%}
.pos-pianta{border:1px solid var(--glass-brd,var(--line));background:var(--glass,var(--card));border-radius:14px;padding:12px 14px;margin:2px 0 12px}
.pos-lab{font-size:12.5px;color:var(--muted);font-weight:600}
.pos-stato{font-size:14px;margin-top:3px}
.pos-pianta .btn{white-space:nowrap}
.vuoto-inv{font-size:13.5px;color:var(--muted);line-height:1.5;display:flex;flex-direction:column;align-items:flex-start;gap:10px}

/* import clienti */
.file-btn{display:block;text-align:center;cursor:pointer}
.imp-col{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.imp-col:first-of-type{border-top:0}
.imp-col>div{flex:1;min-width:0}.imp-col b{display:block;font-size:14px}.imp-col span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-col select{flex:0 0 46%;border:1px solid var(--glass-brd,var(--line));background:var(--glass-2,var(--card));border-radius:10px;padding:8px}
.imp-riep{margin:10px 0 12px;padding-left:18px;font-size:14px}.imp-riep li{margin:3px 0}.imp-riep .att{color:#8a6400}
@media (prefers-color-scheme: dark){.imp-riep .att{color:var(--gold)}}

/* testi legali e consensi */
.legale h4{font-size:15px;margin:16px 0 4px}
.legale p{margin:0 0 6px;font-size:14px;line-height:1.55}
.leg-tab{overflow-x:auto;margin:6px 0 8px}
.leg-tab table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.leg-tab th,.leg-tab td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
.leg-tab th{background:var(--olive-soft);font-weight:700}
.piede-legale{text-align:center;font-size:12.5px;color:var(--muted);margin:14px 0 6px;line-height:1.8}
.piede-legale a{color:var(--muted)}
.chk a,.hint a{color:var(--olive);font-weight:600}
.acc-ov{position:fixed;inset:0;z-index:45;background:rgba(20,22,15,.5);display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.acc{background:var(--glass-2,var(--bg));-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom));text-align:center;box-shadow:0 -12px 40px -10px rgba(0,0,0,.35)}

/* ===== Liquid glass ===== */
:root{
  --r:20px;
  --glass:rgba(255,255,255,.58); --glass-nav:rgba(250,250,244,.70); --glass-2:rgba(255,255,255,.78); --glass-tint:rgba(232,236,214,.55);
  --glass-brd:rgba(255,255,255,.75); --glass-edge:rgba(77,90,44,.10);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.25);
  --glass-sh:0 1px 1px rgba(40,46,20,.04), 0 8px 24px -10px rgba(40,46,20,.18);
  --blur:blur(22px) saturate(180%);
  --mesh:radial-gradient(60% 45% at 8% 4%, rgba(164,181,106,.55), transparent 70%),
         radial-gradient(55% 40% at 100% 18%, rgba(221,185,74,.38), transparent 70%),
         radial-gradient(70% 50% at 85% 95%, rgba(118,134,63,.40), transparent 70%),
         radial-gradient(60% 45% at 0% 80%, rgba(201,162,39,.22), transparent 70%),
         linear-gradient(180deg,#f3f1e6,#eef0e2);
}
@media (prefers-color-scheme: dark){
  :root{
    --glass:rgba(38,42,30,.55); --glass-nav:rgba(34,38,27,.72); --glass-2:rgba(46,51,36,.78); --glass-tint:rgba(164,181,106,.14);
    --glass-brd:rgba(255,255,255,.10); --glass-edge:rgba(0,0,0,.35);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(255,255,255,.03);
    --glass-sh:0 10px 30px -12px rgba(0,0,0,.6);
    --mesh:radial-gradient(60% 45% at 8% 4%, rgba(118,134,63,.40), transparent 70%),
           radial-gradient(55% 40% at 100% 18%, rgba(160,128,30,.22), transparent 70%),
           radial-gradient(70% 50% at 85% 95%, rgba(77,90,44,.45), transparent 70%),
           linear-gradient(180deg,#14160f,#10120c);
  }
}

<script>
/* ===== Configurazione Supabase (chiave pubblica: i dati sono protetti dalle policy RLS) ===== */
const SUPABASE_URL = 'https://dhtlqdlhglsbguxokpxx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_TutxUCRCvuECdvFhChNi1g_n7y8xB6G';
/* ===== Splash di caricamento ===== */
const SPLASH_MSG = ['Risveglio gli ulivi…','Conto le piante…','Pesando le olive…','Accendo il frantoio…','Quasi pronto…'];
const SPLASH_T0 = Date.now();
let splashTimer = null, splashI = 0;
function splashMsg(t){ const m = document.getElementById('splashMsg'); if (!m) return; m.style.opacity = 0; setTimeout(()=>{ m.textContent = t; m.style.opacity = 1; }, 200); }
function showSplash(){
  const s = document.getElementById('splash'); if (!s) return;
  s.classList.remove('out','error'); clearInterval(splashTimer); splashI = 0;
  splashTimer = setInterval(()=>splashMsg(SPLASH_MSG[++splashI % SPLASH_MSG.length]), 1100);
}
function hideSplash(){
  const s = document.getElementById('splash'); if (!s || s.classList.contains('out')) return;
  const wait = S._daCache ? 0 : Math.max(0, 1000 - (Date.now() - SPLASH_T0));
  setTimeout(()=>{ s.classList.add('out'); clearInterval(splashTimer); }, wait);
}
function splashError(t){ const s = document.getElementById('splash'); clearInterval(splashTimer); s.classList.remove('out'); s.classList.add('error'); splashMsg(t); }

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===== Costanti ===== */
const TIPI = ['potatura','concimazione','trattamento','irrigazione','lavorazione terreno','sfalcio','altro'];
const TIPO_IC = {potatura:'✂️',concimazione:'🌱',trattamento:'🧪',irrigazione:'💧','lavorazione terreno':'🚜',sfalcio:'🌾',altro:'📝'};
const STATI = ['sana','sotto osservazione','malata','giovane','morta'];
const STATO_CL = {'sana':'','sotto osservazione':'gold','malata':'red','giovane':'','morta':'grey'};
const CAT_SPESA = ['concimi','fitofarmaci','attrezzatura','carburante','manodopera','acqua','imbottigliamento','assicurazione','altro'];
const CAT_ENTRATA = ['vendita olio','vendita olive','contributi','altro'];
const STAGIONE = [
  ['Concimazione organica di fondo','Riposo vegetativo: manutenzione attrezzi','Bilancio dell\'annata appena chiusa'],
  ['Inizio potatura nei giorni senza gelo','Trattamento rameico dopo i tagli','Pulizia dei polloni'],
  ['Potatura','Trinciatura dei residui di potatura','Concimazione di ripresa'],
  ['Fine potatura','Concimazione azotata','Primo sfalcio dell\'erba'],
  ['Mignolatura e fioritura','Monitoraggio occhio di pavone','Sfalcio'],
  ['Allegagione','Irrigazione di soccorso se secco','Sfalcio'],
  ['Trappole per mosca olearia','Irrigazione nei periodi secchi','Controllo stato chiome'],
  ['Monitoraggio mosca olearia','Irrigazione','Controllo cascola'],
  ['Monitoraggio mosca e invaiatura','Preparare reti, cassette, abbacchiatori','Prenotare il frantoio'],
  ['Prenotare/confermare il frantoio','Inizio raccolta varietà precoci','Verifica tempi di carenza dei trattamenti'],

  ['Fine raccolta','Concimazione organica','Chiusura conti dell\'annata']
];
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MESI_L = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

/* ===== Stato ===== */
const S = { user:null, tab:'home', year:new Date().getFullYear(), filtroTipo:'tutti', filtroApp:'tutti', q:'',
  vista:'lista', colore:'stato', sfondo:'satellite', posiziona:false, posSel:null,
  appezzamenti:[], piante:[], interventi:[], raccolte:[], moliture:[], movimenti:[] };

/* ===== Utility ===== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (n, d=1) => Number(n||0).toLocaleString('it-IT',{maximumFractionDigits:d});
const eur = n => Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fdate = s => s ? new Date(s+'T00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'}) : '';
const inYear = (d, y=S.year) => d && d.slice(0,4) === String(y);
const addDays = (s, n) => { const d=new Date(s+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }; // in UTC: niente slittamenti di fuso
const sum = (arr, f) => arr.reduce((a,x)=>a+(Number(f(x))||0),0);
const appName = id => S.appezzamenti.find(a=>a.id===id)?.nome || '';
const pianta = id => S.piante.find(p=>p.id===id);
const kgOlio = m => m.kg_olio != null ? Number(m.kg_olio) : (m.litri_olio != null ? Number(m.litri_olio)*0.916 : null);
const litri = m => m.litri_olio != null ? Number(m.litri_olio) : (m.kg_olio != null ? Number(m.kg_olio)/0.916 : null);

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',3200); }
function fail(e){ console.error(e); toast('Errore: '+(e?.message||e)); }

/* ===== Dati ===== */
async function loadAll(){
  const own = S.owner || S.user.id;
  const q = (t, sel='*', ord='created_at') => sb.from(t).select(sel).eq('user_id', own).order(ord,{ascending:false});
  const res = await Promise.all([
    q('appezzamenti','*','nome'), sb.from('piante').select('*').eq('user_id', own).order('codice'),
    q('interventi','*, intervento_piante(pianta_id)','data'), q('raccolte','*','data'),
    q('moliture','*','data'), puo('soldi') ? q('movimenti','*','data') : Promise.resolve({ data:[] }),
    sb.from('promemoria').select('*').eq('user_id', own).eq('fatto', false).order('data')
  ]);
  const err = res.find(r=>r.error); if (err) throw err.error;
  [S.appezzamenti,S.piante,S.interventi,S.raccolte,S.moliture,S.movimenti,S.promemoria] = res.map(r=>r.data);
  S.appezzamenti.sort((a,b)=>a.nome.localeCompare(b.nome));
  S.piante.sort((a,b)=>a.codice.localeCompare(b.codice,'it',{numeric:true}));
  await loadVendite();
  S.collaboratori = puo('team') ? ((await sb.from('collaboratori').select('*').eq('owner_id', S.user.id).order('created_at')).data || []) : [];
  scriviCache();
}
/* Copia locale dei dati: all'apertura l'app mostra subito l'ultima versione e intanto aggiorna */
const CACHE_TAB = ['appezzamenti','piante','interventi','raccolte','moliture','movimenti','negozi','formati','clienti','ordini','collaboratori','promemoria','annunci','magazzino'];
const cacheKey = () => 'uliveto:dati:' + S.user?.id + ':' + (S.owner || S.user?.id);
function scriviCache(){ try { localStorage.setItem(cacheKey(), JSON.stringify(Object.fromEntries(CACHE_TAB.map(t=>[t,S[t]])))); } catch(e){} }
function leggiCache(){ try { const c = JSON.parse(localStorage.getItem(cacheKey()) || 'null'); return c && CACHE_TAB.every(t=>Array.isArray(c[t])) ? c : null; } catch(e){ return null; } }
function svuotaCache(){ try { Object.keys(localStorage).filter(k=>k.startsWith('uliveto:dati:')).forEach(k=>localStorage.removeItem(k)); } catch(e){} }
const TAB_PROPRIE = ['appezzamenti','piante','interventi','raccolte','moliture','movimenti','promemoria','magazzino_olio'];
async function save(table, values, id){
  if (!id && TAB_PROPRIE.includes(table) && values.user_id == null) values = { ...values, user_id: S.owner || S.user.id };
  if (!(table in TAB_OFFLINE)) {
    const q = id ? sb.from(table).update(values).eq('id',id) : sb.from(table).insert(values);
    const { data, error } = await q.select().single();
    if (error) throw error; return data;
  }
  if (!id) values = { id: nuovoId(), ...values };
  await scrivi(id ? { k:'upd', t:table, id, v:values } : { k:'ins', t:table, v:values });
  const loc = (S[TAB_OFFLINE[table]] || []).find(x => x.id === (id || values.id));
  return { ...(loc || {}), ...values, id: id || values.id };
}
async function remove(table, id){
  if (!confirm('Eliminare definitivamente questo elemento?')) return false;
  if (table in TAB_OFFLINE) { await scrivi({ k:'del', t:table, id }); return true; }
  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) throw error; return true;
}
async function refresh(){
  if (leggiCoda().length) await inviaCoda();
  try {
    await loadAll();
    const coda = leggiCoda(); if (coda.length) { coda.forEach(applicaLocale); scriviCache(); }
    S._caricato = true; S._offline = false; render(); apriDaLink();
  } catch(e) {
    if (erroreDiRete(e) && S._caricato) { S._offline = true; render(); apriDaLink(); }
    else fail(e);
  }
}

/* ===== Salvataggi senza rete =====
   Lavori, raccolte, piante, promemoria e conti si salvano anche senza campo: restano in coda sul telefono
   e partono da soli appena torna la rete. Ogni riga nuova ha già il suo id, quindi un invio ripetuto non crea doppioni. */
const TAB_OFFLINE = { appezzamenti:'appezzamenti', piante:'piante', interventi:'interventi', intervento_piante:null, raccolte:'raccolte',
  moliture:'moliture', movimenti:'movimenti', promemoria:'promemoria', magazzino_olio:'magazzino' };
const codaKey = () => 'uliveto:coda:' + S.user?.id + ':' + (S.owner || S.user?.id);
function leggiCoda(){ try { return JSON.parse(localStorage.getItem(codaKey()) || '[]'); } catch(e){ return []; } }
function scriviCoda(c){ try { localStorage.setItem(codaKey(), JSON.stringify(c)); } catch(e){} aggiornaSpia(); }
const nuovoId = () => crypto.randomUUID ? crypto.randomUUID()
  : '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
const erroreDiRete = e => !navigator.onLine || e?._rete || /failed to fetch|fetch failed|network|load failed|abort|timeout|internet/i.test((e?.message || '') + ' ' + (e?.name || ''));
async function eseguiOp(op){
  let q = op.k === 'ins' ? sb.from(op.t).upsert(op.v, { ignoreDuplicates:true })
    : op.k === 'upd' ? sb.from(op.t).update(op.v).eq('id', op.id)
    : op.k === 'del' ? sb.from(op.t).delete().eq('id', op.id)
    : sb.from(op.t).delete().eq(op.col, op.val);
  if (q.abortSignal && window.AbortSignal?.timeout) q = q.abortSignal(AbortSignal.timeout(10000));
  let r; try { r = await q; } catch(e) { e._rete = true; throw e; }
  if (r.error) { if (r.status === 0 || erroreDiRete(r.error)) r.error._rete = true; throw r.error; }
}
async function scrivi(op){
  const coda = leggiCoda();
  if (!coda.length && navigator.onLine) {
    try { await eseguiOp(op); return 'ok'; } catch(e) { if (!e._rete) throw e; }
  }
  coda.push(op); scriviCoda(coda); applicaLocale(op); scriviCache(); S._inCoda = true;
  return 'coda';
}
function applicaLocale(op){
  if (op.t === 'intervento_piante') {
    if (op.k === 'delw') { const i = S.interventi.find(x => x.id === op.val); if (i) i.intervento_piante = []; }
    if (op.k === 'ins') [].concat(op.v).forEach(r => { const i = S.interventi.find(x => x.id === r.intervento_id); if (i && !(i.intervento_piante ||= []).some(x => x.pianta_id === r.pianta_id)) i.intervento_piante.push({ pianta_id:r.pianta_id }); });
    return;
  }
  const key = TAB_OFFLINE[op.t]; if (!key) return; const arr = S[key] ||= [];
  if (op.k === 'ins') [].concat(op.v).forEach(r => { const j = arr.findIndex(x => x.id === r.id);
    if (j >= 0) Object.assign(arr[j], r, { _attesa:true });
    else arr.unshift({ created_at:new Date().toISOString(), ...(op.t === 'interventi' ? { intervento_piante:[] } : {}), ...(op.t === 'promemoria' ? { fatto:false } : {}), ...r, _attesa:true }); });
  if (op.k === 'upd') { const r = arr.find(x => x.id === op.id); if (r) Object.assign(r, op.v, { _attesa:true }); }
  if (op.k === 'del') { const j = arr.findIndex(x => x.id === op.id); if (j >= 0) arr.splice(j, 1); }
  if (op.t === 'promemoria') S.promemoria = S.promemoria.filter(x => !x.fatto).sort((a, b) => a.data.localeCompare(b.data));
  if (op.t === 'piante') S.piante.sort((a, b) => a.codice.localeCompare(b.codice, 'it', { numeric:true }));
  if (op.t === 'appezzamenti') S.appezzamenti.sort((a, b) => a.nome.localeCompare(b.nome));
}
async function inviaCoda(){
  if (inviaCoda._in) return inviaCoda._in;
  return inviaCoda._in = (async () => {
    let coda = leggiCoda(), inviati = 0;
    while (coda.length && navigator.onLine) {
      try { await eseguiOp(coda[0]); inviati++; }
      catch(e) { if (e._rete) break; console.error(e); toast('Un salvataggio fatto senza rete non è stato accettato: ' + (e.message || e)); }
      coda = leggiCoda(); coda.shift(); scriviCoda(coda);
    }
    if (inviati && !coda.length) toast(`📶 Inviati ${inviati === 1 ? 'il salvataggio fatto' : inviati + ' salvataggi fatti'} senza rete ✓`);
    return inviati;
  })().finally(() => { inviaCoda._in = null; });
}
async function sincronizza(daUtente){
  if (!S.user || modoCliente()) return;
  if (!navigator.onLine) { aggiornaSpia(); if (daUtente) toast('Ancora senza rete: riprovo da solo appena torna il campo'); return; }
  if (!leggiCoda().length && !S._offline) return;
  const n = await inviaCoda();
  if (n || S._offline) await refresh();
  else if (daUtente && leggiCoda().length) toast('Rete ancora debole: riprovo tra poco');
}
function spiaRete(){
  const n = S.user ? leggiCoda().length : 0;
  if (!n && !S._offline && navigator.onLine) return '';
  return `<button class="spia ${n ? 'attesa' : ''}" onclick="sincronizza(true)" title="Salvataggi in attesa di rete">${n ? `⏳ ${n} da inviare` : '📵 Senza rete'}</button>`;
}
function aggiornaSpia(){ const h = $('#spiaRete'); if (h) h.innerHTML = spiaRete(); }
window.addEventListener('online', () => { aggiornaSpia(); setTimeout(() => sincronizza(), 1500); });
window.addEventListener('offline', () => { S._offline = true; aggiornaSpia(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user && leggiCoda().length) sincronizza(); });

/* ===== Calcoli annata ===== */
function annata(y){
  const rac = S.raccolte.filter(r=>inYear(r.data,y));
  const mol = S.moliture.filter(m=>inYear(m.data,y));
  const int = S.interventi.filter(i=>inYear(i.data,y));
  const mov = S.movimenti.filter(m=>inYear(m.data,y));
  const kgRacc = sum(rac,r=>r.kg_olive);
  const kgMol = sum(mol,m=>m.kg_olive);
  const molConOlio = mol.filter(m=>kgOlio(m)!=null);
  const resa = sum(molConOlio,m=>m.kg_olive) ? sum(molConOlio,kgOlio)/sum(molConOlio,m=>m.kg_olive)*100 : null;
  const lt = sum(mol, m=>litri(m)||0);
  const spese = sum(mov.filter(m=>m.tipo==='spesa'),m=>m.importo) + sum(int,i=>i.costo) + sum(mol,m=>m.costo);
  const entrate = sum(mov.filter(m=>m.tipo==='entrata'),m=>m.importo);
  const ore = sum(int,i=>i.ore);
  return { rac, mol, int, mov, kgRacc, kgMol, resa, lt, spese, entrate, ore };
}
function anni(){
  const ys = new Set([new Date().getFullYear()]);
  [S.raccolte,S.moliture,S.interventi,S.movimenti].forEach(a=>a.forEach(x=>x.data&&ys.add(+x.data.slice(0,4))));
  return [...ys].sort((a,b)=>b-a);
}
function interventiPianta(p){
  return S.interventi.filter(i=>{
    const ids = (i.intervento_piante||[]).map(x=>x.pianta_id);
    if (ids.length) return ids.includes(p.id);
    if (i.appezzamento_id) return i.appezzamento_id === p.appezzamento_id;
    return true; // intervento sull'intero uliveto
  });
}
function targetLabel(i){
  const n = (i.intervento_piante||[]).length;
  if (n === 1) return 'Pianta '+(pianta(i.intervento_piante[0].pianta_id)?.codice||'');
  if (n > 1) return n+' piante';
  if (i.appezzamento_id) return appName(i.appezzamento_id);
  return 'Intero uliveto';
}

/* I numeri dei riquadri salgono da zero al valore finale */
function contaNumeri(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('#view .kpi .v').forEach(el => {
    const txt = el.textContent, m = txt.match(/\d[\d.]*(,\d+)?/);
    if (!m) return;
    const dec = m[1] ? m[1].length - 1 : 0, fine = parseFloat(m[0].replace(/\./g,'').replace(',','.'));
    if (!fine) return;
    const t0 = performance.now(), dur = 750;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = txt.replace(m[0], (fine * e).toLocaleString('it-IT', { minimumFractionDigits:dec, maximumFractionDigits:dec }));
      if (k < 1) requestAnimationFrame(step); else el.textContent = txt;
    };
    requestAnimationFrame(step);
  });
}

let _leaflet = null;
function caricaLeaflet(){
  if (window.L) return Promise.resolve();
  return _leaflet ||= new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
    s.onload = ok; s.onerror = () => { _leaflet = null; s.remove(); ko(); };
    document.head.appendChild(s);

}
function initMap(con, colore){
  if (!window.L){ $('#map').innerHTML = '<div class="empty">Mappa non disponibile: libreria non caricata.</div>'; return; }
  try { S._map && S._map.remove(); } catch(e){}
  const map = S._map = L.map('map', { maxZoom:21 });
  const sat = S.sfondo==='satellite';
  L.tileLayer(sat ? 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}' : 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom:21, maxNativeZoom:19, attribution: sat ? 'Esri World Imagery' : '© OpenStreetMap' }).addTo(map);
  con.forEach(p => {
    L.circleMarker([p.lat,p.lng], { radius:8, color:'#fff', weight:2, fillColor:colore(p), fillOpacity:.95 })
      .bindTooltip(esc(p.codice), { permanent:true, direction:'top', offset:[0,-8] })
      .on('click', ev => { L.DomEvent.stopPropagation(ev); if (!S.posiziona) detPianta(p.id); })
      .addTo(map);
  });
  // Etichetta con il nome di ogni lotto che ha un indirizzo localizzato
  const lotti = S.appezzamenti.filter(a=>a.lat!=null);
  lotti.forEach(a => L.marker([a.lat,a.lng], { interactive:false, icon:L.divIcon({ className:'lotto-pin', html:`<div>📍 ${esc(a.nome)}</div>`, iconSize:[0,0] }) }).addTo(map));
  if (S._mapView) map.setView(S._mapView.c, S._mapView.z);
  else if (con.length) map.fitBounds(L.latLngBounds(con.map(p=>[p.lat,p.lng])).pad(0.15), { maxZoom:19 });
  else if (lotti.length) map.setView([lotti[0].lat,lotti[0].lng], 18);
  else {
    map.setView([41.9,12.5], 6);
    navigator.geolocation?.getCurrentPosition(pos => map.setView([pos.coords.latitude,pos.coords.longitude], 18), ()=>{}, { timeout:8000 });
  }
  const etichette = () => map.getContainer().classList.toggle('labels', map.getZoom() >= 20);
  map.on('moveend zoomend', () => { S._mapView = { c:map.getCenter(), z:map.getZoom() }; etichette(); });
  map.on('click', e => { if (S.posiziona && S.posSel) assegnaPos(S.posSel, e.latlng.lat, e.latlng.lng); });
  etichette();
}
function posGps(){
  if (!S.posSel) return;

  toast('Rilevo la posizione…');
  navigator.geolocation.getCurrentPosition(
    pos => assegnaPos(S.posSel, pos.coords.latitude, pos.coords.longitude, Math.round(pos.coords.accuracy)),
    e => toast('Posizione non disponibile: '+e.message),

async function assegnaPos(id, lat, lng, acc){
  const p = pianta(id); if (!p) return;
  if (p.lat!=null && !confirm(`${p.codice} ha già una posizione. Sostituirla?`)) return;
  const v = { lat:+lat.toFixed(7), lng:+lng.toFixed(7) };
  try { await save('piante', v, id); } catch(e) { return fail(e); }
  Object.assign(p, v);
  if (S.posUna === id) { S.posUna = null; S.posiziona = false; toast(`${p.codice} posizionata ✓`); viewMappa(); return; }

  toast(`${p.codice} posizionata${acc?` (±${acc} m)`:''}${next?` · ora tocca a ${next.codice}`:' · tutte posizionate ✓'}`);
  viewMappa();
}

/* ===== Meteo (Open-Meteo, gratuito e senza chiave) ===== */
const WMO = {0:['☀️','Sereno'],1:['🌤️','Poco nuvoloso'],2:['⛅','Parz. nuvoloso'],3:['☁️','Coperto'],45:['🌫️','Nebbia'],48:['🌫️','Nebbia con brina'],
  51:['🌦️','Pioviggine'],53:['🌦️','Pioviggine'],55:['🌦️','Pioviggine'],56:['🌧️','Pioviggine gelata'],57:['🌧️','Pioviggine gelata'],
  61:['🌧️','Pioggia debole'],63:['🌧️','Pioggia'],65:['🌧️','Pioggia forte'],66:['🌧️','Pioggia gelata'],67:['🌧️','Pioggia gelata'],
  71:['🌨️','Neve debole'],73:['🌨️','Neve'],75:['❄️','Neve forte'],77:['🌨️','Nevischio'],80:['🌦️','Rovesci'],81:['🌧️','Rovesci'],82:['⛈️','Rovesci forti'],
  85:['🌨️','Rovesci di neve'],86:['❄️','Rovesci di neve'],95:['⛈️','Temporale'],96:['⛈️','Temporale con grandine'],99:['⛈️','Temporale con grandine']};
const wmo = c => WMO[c] || ['🌡️',''];
const GG = ['dom','lun','mar','mer','gio','ven','sab'];
const _meteoCache = {};
function centro(ps){ return ps.length ? { lat: sum(ps,p=>p.lat)/ps.length, lng: sum(ps,p=>p.lng)/ps.length } : null; }
function luoghiMeteo(){
  const out = [];
  S.appezzamenti.forEach(a => {
    const c = a.lat!=null ? {lat:a.lat,lng:a.lng} : centro(S.piante.filter(p=>p.appezzamento_id===a.id && p.lat!=null));
    if (c) out.push({ id:a.id, nome:a.nome, ...c });
  });
  const sciolte = centro(S.piante.filter(p=>!p.appezzamento_id && p.lat!=null));
  if (sciolte) out.push({ id:'_', nome: out.length ? 'Altre piante' : 'Uliveto', ...sciolte });
  return out;
}
async function meteo(lat, lng){
  const k = lat.toFixed(3)+','+lng.toFixed(3), c = _meteoCache[k];
  if (c && Date.now() - c.t < 15*60*1000) return c.d;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}`
    + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max'
    + '&past_days=7&forecast_days=7&timezone=auto';
  const res = await fetch(url); if (!res.ok) throw new Error('meteo '+res.status);
  const d = await res.json(); _meteoCache[k] = { t:Date.now(), d }; return d;
}
function giorniMeteo(d){
  const D = d.daily, oggi = today();
  return D.time.map((t,i)=>({ data:t, code:D.weather_code[i], max:D.temperature_2m_max[i], min:D.temperature_2m_min[i],
    pioggia:D.precipitation_sum[i]||0, prob:D.precipitation_probability_max[i], vento:D.wind_speed_10m_max[i], passato:t<oggi, oggi:t===oggi }));
}
const nomeGiorno = (s, oggi) => s===today() ? 'Oggi' : GG[new Date(s+'T00:00').getDay()];
function adattoTrattamenti(g, dopo){ return g.pioggia < 0.5 && (g.prob ?? 0) < 30 && g.vento < 15 && (!dopo || dopo.pioggia < 2); }
function consigliMeteo(gs, luogoId){
  const fut = gs.filter(g=>!g.passato), pass = gs.filter(g=>g.passato), h = [];
  const gelo = fut.filter(g=>g.min <= 0);
  if (gelo.length) { const g = gelo.reduce((a,b)=>a.min<b.min?a:b);
    h.push(`❄️ <b>Gelo previsto</b> ${nomeGiorno(g.data)} (minima ${num(g.min)}°C)${g.min<=-5?': rischio danni alla chioma, specie per le piante giovani':''}. Rimanda le potature a dopo.`); }
  const ok = fut.filter((g,i)=>adattoTrattamenti(g, fut[i+1]));
  if (ok.length) h.push(`🧪 <b>Giorni adatti ai trattamenti</b>: ${ok.map(g=>nomeGiorno(g.data)).join(', ')} (niente pioggia, vento debole).`);
  else h.push('🧪 Nei prossimi giorni non ci sono finestre ideali per i trattamenti: pioggia o vento in vista.');
  const forte = fut.find(g=>g.pioggia >= 20);
  if (forte) h.push(`🌧️ <b>Pioggia abbondante</b> ${nomeGiorno(forte.data)}: circa ${num(forte.pioggia,0)} mm.`);
  const tratt = S.interventi.filter(i=>i.tipo==='trattamento' && i.data >= addDays(today(),-7) && i.data < today()
    && (!i.appezzamento_id || luogoId==='_' || i.appezzamento_id===luogoId));
  tratt.forEach(i => {
    const mm = sum(pass.filter(g=>g.data > i.data), g=>g.pioggia);
    if (mm >= 10) h.push(`☔ Dopo il trattamento ${i.prodotto?'con '+esc(i.prodotto)+' ':''}del ${fdate(i.data)} sono caduti ${num(mm,0)} mm: potrebbe essere stato dilavato.`);
  });
  h.push(`💧 Pioggia degli ultimi 7 giorni: <b>${num(sum(pass,g=>g.pioggia))} mm</b>.`);
  return h;
}
async function meteoHome(){
  const box = $('#meteoCard'); if (!box) return;
  const luoghi = luoghiMeteo();
  if (!luoghi.length) { box.innerHTML = `<h2>🌤️ Meteo</h2><div class="muted">Aggiungi l'indirizzo di un appezzamento (Piante → Appezzamenti) o posiziona le piante sulla mappa per vedere il meteo della zona.</div>`; return; }
  const L0 = luoghi.find(l=>l.id===S.meteoLuogo) || luoghi[0]; S.meteoLuogo = L0.id;
  try {
    const d = await meteo(L0.lat, L0.lng); if (!$('#meteoCard')) return;
    const c = d.current, gs = giorniMeteo(d), fut = gs.filter(g=>!g.passato);
    box.innerHTML = `<h2>🌤️ Meteo<span class="sp"></span><span class="muted" style="font-weight:400">${esc(L0.nome)}</span></h2>
      ${luoghi.length>1?`<div class="chips">${luoghi.map(l=>`<button class="chip ${l.id===L0.id?'on':''}" onclick="S.meteoLuogo='${l.id}';meteoHome()">${esc(l.nome)}</button>`).join('')}</div>`:''}
      <div class="meteo-now"><span class="e">${wmo(c.weather_code)[0]}</span><span class="temp">${Math.round(c.temperature_2m)}°</span>
        <span class="det">${wmo(c.weather_code)[1]} · percepita ${Math.round(c.apparent_temperature)}°<br>Vento ${Math.round(c.wind_speed_10m)} km/h · Umidità ${c.relative_humidity_2m}%</span></div>
      <div class="days">${fut.map((g,i)=>`<div class="day ${g.min<=0?'gelo':adattoTrattamenti(g,fut[i+1])?'ok':''}"><b>${nomeGiorno(g.data)}</b><span class="e">${wmo(g.code)[0]}</span>${Math.round(g.max)}° <span class="muted">${Math.round(g.min)}°</span><div class="r">${g.pioggia>=0.5?num(g.pioggia,0)+' mm':''}</div></div>`).join('')}</div>
      <div class="muted" style="font-size:11.5px">Bordo verde: giorno adatto ai trattamenti · bordo blu: gelo</div>
      <ul class="hints">${consigliMeteo(gs, L0.id).map(x=>`<li>${x}</li>`).join('')}</ul>
      <div class="muted" style="font-size:11px;margin-top:6px">Dati meteo: Open-Meteo.com</div>`;
  } catch(e) { box.innerHTML = `<h2>🌤️ Meteo</h2><div class="muted">Previsioni non disponibili al momento.</div>`; }
}
async function meteoPianta(p){
  const box = $('#meteoPianta'); if (!box) return;

function apriDaLink(){

  const t = location.hash.match(/^#tab=(home|piante|lavori|raccolta|vendite|conti)$/);

/* ===== Sheet & form ===== */
/* Foglio che sale dal basso: si chiude con ✕, toccando fuori, trascinando verso il basso, con Esc o con il tasto/gesto Indietro */
function openSheet(html){
  const sh = $('#sheet'), pn = $('#sheet .panel');
  $('#sheetBody').innerHTML = html; pn.style.transform = ''; sh.classList.add('open'); pn.scrollTop = 0;
  if (!S._sheetStoria) { S._sheetStoria = true; try { history.pushState({ foglio:1 }, ''); } catch(e){} }
}
function closeSheet(){
  $('#sheet').classList.remove('open');
  // se subito dopo si apre un altro foglio, la voce nella cronologia resta valida
  setTimeout(() => { if (!$('#sheet').classList.contains('open') && S._sheetStoria) { S._sheetStoria = false; S._ignoraPop = true; history.back(); } }, 0);
}
$('#sheet').addEventListener('click', e=>{ if(e.target.id==='sheet') closeSheet(); });
window.addEventListener('popstate', () => {
  if (S._ignoraPop) { S._ignoraPop = false; return; }
  if (S._sheetStoria && $('#sheet').classList.contains('open')) { S._sheetStoria = false; $('#sheet').classList.remove('open'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet(); });
(() => { // trascina verso il basso per chiudere
  const pn = $('#sheet .panel'); let y0 = null, dy = 0, dalTop = false;
  pn.addEventListener('touchstart', e => { const t = e.target; dalTop = !!t.closest('.sheet-top');
    y0 = (pn.scrollTop <= 0 || dalTop) && !t.closest('input,textarea,select,.plist,#map,.chips,.vt-gal') ? e.touches[0].clientY : null; dy = 0; }, { passive:true });
  pn.addEventListener('touchmove', e => { if (y0 == null) return; dy = e.touches[0].clientY - y0;
    if (dy > 0 && (pn.scrollTop <= 0 || dalTop)) { e.preventDefault(); pn.style.transition = 'none'; pn.style.transform = `translateY(${dy}px)`; } else if (dy < 0 && !dalTop) y0 = null; }, { passive:false });
  pn.addEventListener('touchend', () => { if (y0 == null) return; pn.style.transition = 'transform .22s ease';
    if (dy > 90) { pn.style.transform = 'translateY(100%)'; setTimeout(() => { closeSheet(); pn.style.transform = ''; pn.style.transition = ''; }, 200); }
    else { pn.style.transform = ''; setTimeout(() => pn.style.transition = '', 230); } y0 = null; });
})();

function fieldHtml(f){
  if (f.type==='hidden') return `<input type="hidden" name="${f.name}" value="${esc(f.value ?? '')}">`;
  const v = f.value ?? '';
  const req = f.required ? 'required' : '';
  let input;
  if (f.type==='select') input = `<select name="${f.name}" ${req}>${f.empty!==false?`<option value="">${f.empty||'—'}</option>`:''}${f.options.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
  else if (f.type==='textarea') input = `<textarea name="${f.name}">${esc(v)}</textarea>`;
  else if (f.type==='piante') {
    const sel = new Set(f.value||[]);
    input = `<div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap">
      <button type="button" class="btn sm sec" onclick="selPiante(true)">Tutte</button>
      <button type="button" class="btn sm sec" onclick="selPiante(false)">Nessuna</button>
      ${S.appezzamenti.map(a=>`<button type="button" class="btn sm sec" onclick="selPiante('${a.id}')">${esc(a.nome)}</button>`).join('')}</div>
      <div class="plist">${S.piante.map(p=>`<label><input type="checkbox" name="piante" value="${p.id}" data-app="${p.appezzamento_id||''}" ${sel.has(p.id)?'checked':''}> ${esc(p.codice)} <span class="muted">${esc(p.varieta||'')}</span></label>`).join('')||'<div class="empty">Nessuna pianta ancora.</div>'}</div>`;
  }
  else input = `<input name="${f.name}" type="${f.type||'text'}" ${f.type==='number'?'step="any" inputmode="decimal"':''} value="${esc(v)}" ${req} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
  return `<label class="f"><span>${esc(f.label)}</span>${input}</label>${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}`;
}
function selPiante(m){ document.querySelectorAll('input[name=piante]').forEach(c=>c.checked = m===true ? true : m===false ? false : (c.checked || c.dataset.app===m)); }

function openForm({title, fields, onSubmit, onDelete, extra='', sezioni={}}){
  fields = fields.filter(Boolean);
  const rows = [], perSez = {}; // affianca campi marcati half; i campi con "sez" vanno in un riquadro apribile
  for (let i=0;i<fields.length;i++){
    const f=fields[i]; let h;
    if (f.half && fields[i+1]?.half){ h = `<div class="grid2"><div>${fieldHtml(f)}</div><div>${fieldHtml(fields[i+1])}</div></div>`; i++; }
    else h = fieldHtml(f);
    if (f.gruppo) h = `<div data-gruppo="${f.gruppo}">${h}</div>`;
    if (f.sez) (perSez[f.sez] ||= []).push(h); else rows.push(h);
  }
  const apribili = Object.entries(perSez).map(([k, hs]) => `<details class="altro" data-sez="${k}" ${sezioni[k]?.open ? 'open' : ''}><summary>${esc(sezioni[k]?.t || 'Più dettagli')}</summary><div class="altro-in">${hs.join('')}</div></details>`).join('');
  openSheet(`<h3>${esc(title)}</h3><form id="frm">${rows.join('')}${apribili}${extra}
    <div class="actions">${onDelete?'<button type="button" class="btn danger" id="del">Elimina</button>':''}<button type="button" class="btn sec" onclick="closeSheet()">Annulla</button><button class="btn" type="submit">Salva</button></div></form>`);
  const frm = $('#frm');
  frm.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(frm), vals = {};
    for (const f of fields){
      if (f.type==='piante') { vals[f.name] = fd.getAll('piante'); continue; }
      let v = fd.get(f.name); v = (v===null||v==='') ? null : v;
      if (v!==null && (f.type==='number'||f.num)) v = Number(String(v).replace(',','.'));
      vals[f.name] = v;
    }
    const btn = frm.querySelector('[type=submit]'); btn.disabled = true; btn.textContent='Salvo…';
    S._inCoda = false;
    try { await onSubmit(vals); closeSheet();
      if (S._inCoda) { render(); toast('📲 Salvato sul telefono: lo invio appena c\'è campo'); }
      else { await refresh(); toast('Salvato ✓'); } }
    catch(err){ fail(err); btn.disabled=false; btn.textContent='Salva'; }
  };
  if (onDelete) $('#del').onclick = async ()=>{ S._inCoda = false; try{ if(await onDelete()){ closeSheet(); if (S._inCoda) render(); else await refresh(); toast('Eliminato'); } }catch(err){ fail(err); } };
}

const NOMINATIM = 'https://nominatim.openstreetmap.org';
function provDa(ad){ const iso = ad['ISO3166-2-lvl6'] || ''; return iso.startsWith('IT-') ? iso.slice(3) : ''; }
function comuneDa(ad){ return ad.city || ad.town || ad.village || ad.municipality || ad.hamlet || ''; }
function viaDa(ad){ return [ad.road || ad.locality || ad.isolated_dwelling || ad.hamlet || '', ad.house_number || ''].filter(Boolean).join(' '); }
function setLotto(r){
  const ad = r.address || {}, f = $('#frm'); if (!f) return;
  const via = viaDa(ad); if (via) f.indirizzo.value = via;
  if (comuneDa(ad)) f.comune.value = comuneDa(ad);
  if (provDa(ad)) f.provincia.value = provDa(ad);
  f.cap.value = ad.postcode || '';
  f.lat.value = (+r.lat).toFixed(7); f.lng.value = (+r.lon).toFixed(7);
  $('#addrSug').innerHTML = '';
  $('#addrStato').innerHTML = `📍 Posizione trovata · <a href="https://www.google.com/maps/search/?api=1&query=${f.lat.value},${f.lng.value}" target="_blank" rel="noopener">verifica su Google Maps ↗</a>`;
}
/* Coordinate da Google Maps: "41.56, 14.66", link lunghi (anche con !3d…!4d…) e link brevi maps.app.goo.gl */
function coordDaTesto(t){
  t = String(t || ''); try { t = decodeURIComponent(t); } catch(e){}
  t = t.replace(/\s+/g, ' ').trim();
  const ok = (la, lo) => { la = +la; lo = +lo; return isFinite(la) && isFinite(lo) && Math.abs(la) <= 90 && Math.abs(lo) <= 180 && !(la === 0 && lo === 0) ? { lat:la, lng:lo } : null; };
  let m;
  if ((m = t.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/))) return ok(m[1], m[2]);                 // puntina del luogo
  if ((m = t.match(/[?&](?:q|query|ll|destination|center)=(-?\d+(?:\.\d+)?),\s*\+?(-?\d+(?:\.\d+)?)/))) return ok(m[1], m[2]);
  if ((m = t.match(/\/(?:search|place|dir)\/(?:[^/]*\/)?(-?\d+(?:\.\d+)?),\s*\+?(-?\d+(?:\.\d+)?)/))) return ok(m[1], m[2]);
  if ((m = t.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/))) return ok(m[1], m[2]);                     // centro della mappa
  if ((m = t.match(/^(-?\d{1,2}(?:[.,]\d+)?)\s*[,; ]\s*(-?\d{1,3}(?:[.,]\d+)?)$/))) return ok(m[1].replace(',', '.'), m[2].replace(',', '.'));
  if ((m = t.match(/(\d{1,2})°\s*(\d{1,2})'\s*([\d.]+)"?\s*([NS])\s*,?\s*(\d{1,3})°\s*(\d{1,2})'\s*([\d.]+)"?\s*([EOW])/i))) {  // 41°33'40.3"N 14°39'36.4"E
    const g = (d, mi, se, h) => (+d + mi / 60 + se / 3600) * (/[SWO]/i.test(h) ? -1 : 1);
    return ok(g(m[1], m[2], m[3], m[4]), g(m[5], m[6], m[7], m[8]));
  }
  return null;
}
async function daGoogleMaps(){

    $('#addrStato').textContent = 'Leggo il link…';
    const { data, error } = await sb.functions.invoke('risolvi-link', { body:{ url:t } });
    if (!error && data?.url) c = coordDaTesto(data.url);
    if (!c) { $('#addrStato').textContent = ''; return toast('Non riesco a leggere questo link: copia direttamente le coordinate (tieni premuto sul punto in Google Maps)'); }

async function cercaIndirizzo(){
  const f = $('#frm'); if (!f) return;
  const q = [f.indirizzo.value.trim(), f.comune.value.trim(), f.provincia.value.trim()].filter(Boolean).join(', ');

  try {
    const res = await fetch(`${NOMINATIM}/search?format=jsonv2&addressdetails=1&countrycodes=it&limit=5&accept-language=it&q=${encodeURIComponent(q)}`);

function lottoQui(){
  if (!navigator.geolocation) return toast('Geolocalizzazione non disponibile');
  toast('Rilevo la posizione…');
  navigator.geolocation.getCurrentPosition(async pos => {
    const r = { lat:pos.coords.latitude, lon:pos.coords.longitude, address:{} };
    try { const res = await fetch(`${NOMINATIM}/reverse?format=jsonv2&addressdetails=1&accept-language=it&lat=${r.lat}&lon=${r.lon}`); const j = await res.json(); r.address = j.address || {}; } catch(e){}
    setLotto(r); toast('Posizione del lotto impostata');
  }, e => toast('Posizione non disponibile: '+e.message), { enableHighAccuracy:true, timeout:15000 });
}
function indirizzoLotto(a){
  if (!a) return '';
  return [a.indirizzo, [a.cap, a.comune].filter(Boolean).join(' ') + (a.provincia ? ` (${a.provincia})` : '')].filter(x=>x && x.trim()).join(', ');
}
function catastoLotto(a){ return a && (a.foglio || a.particella) ? `Fg. ${a.foglio||'—'} · Part. ${a.particella||'—'}` : ''; }
function navigaLotto(a){
  const dest = a.lat!=null ? `${a.lat},${a.lng}` : indirizzoLotto(a);
  return dest ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}` : '';
}

/* Accettazione dei termini: alla registrazione (casella) e, per chi è già registrato, al primo accesso dopo un cambio di versione */
const terminiKey = () => 'uliveto:termini:' + S.user?.id;
async function controllaTermini(){
  if (!S.user) return;
  try { if (localStorage.getItem(terminiKey()) === LEGALE.versione) return; } catch(e){}
  const { data, error } = await sb.from('consensi').select('id').eq('user_id', S.user.id).eq('tipo', 'termini').eq('versione', LEGALE.versione).limit(1);
  if (error) return;   // senza rete riproviamo al prossimo avvio
  const segna = () => { try { localStorage.setItem(terminiKey(), LEGALE.versione); } catch(e){} };
  if (data?.length) return segna();
  const m = S.user.user_metadata || {};
  if (m.termini === LEGALE.versione) {   // accettati con la casella al momento della registrazione
    const r = await sb.from('consensi').insert({ tipo:'termini', versione:LEGALE.versione, dettaglio:'registrazione ' + (m.termini_at || '') });
    if (!r.error) segna(); return;
  }
  mostraAccettazione();
}
function mostraAccettazione(){
  if ($('#accetta')) return;
  document.body.insertAdjacentHTML('beforeend', `<div id="accetta" class="acc-ov" role="dialog" aria-modal="true" aria-label="Termini e privacy"><div class="acc">
    <div class="nv-spark"><span>📄</span></div><h2>Termini e privacy</h2>
    <p>Per continuare a usare Il mio Uliveto leggi e accetta i termini d'uso e l'informativa privacy (versione ${LEGALE.versione}).</p>
    <div class="acc-link">${linkLeg('termini','📄 Termini e condizioni')}${linkLeg('privacy','🔒 Informativa privacy')}</div>
    <label class="chk"><input type="checkbox" id="accChk"> Ho letto e accetto i Termini e condizioni e ho letto l'Informativa privacy.</label>
    <button class="btn block" onclick="accettaTermini(this)">Continua</button>
    <button class="link" onclick="logout().then(()=>$('#accetta')?.remove())">Non accetto: esci</button></div></div>`);
}
async function accettaTermini(b){
  if (!$('#accChk').checked) return toast('Spunta la casella per continuare');
  b.disabled = true;
  const { error } = await sb.from('consensi').insert({ tipo:'termini', versione:LEGALE.versione });
  if (error) { b.disabled = false; return fail(error); }
  try { localStorage.setItem(terminiKey(), LEGALE.versione); } catch(e){}
  $('#accetta').remove(); toast('Grazie ✓');
}
const registraConsenso = (tipo, extra = {}) => sb.from('consensi').insert({ tipo, versione:LEGALE.versione, ...extra }).then(r => { if (r.error) console.error(r.error); });
